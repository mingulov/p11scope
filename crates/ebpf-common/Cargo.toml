[package]
name = "p11scope-ebpf-common"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[features]
# Userspace side needs aya's Pod impls; the kernel side must stay no_std.
user = ["dep:aya"]
wide-detailed-2112 = []
# Shrinks only the ring for the event-loss induced-gap test.
small-ring = []
# Shrinks START and RV_COUNTS for their independent induced-gap tests.
small-state-maps = []
# Shrinks only the private live-discovery ring for its induced-gap test.
small-discovery-ring = []

[dependencies]
aya = { version = "=0.14.0", optional = true }
pkcs11-module = { version = "0.2.0", git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2", default-features = false }
