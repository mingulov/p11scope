name: ci
on:
  push:
  pull_request:
  # Manual runs from the Actions tab. The two dispatch-only jobs below run
  # only when their input is selected; every other job runs as on push.
  workflow_dispatch:
    inputs:
      release_preview:
        description: Run release-preview (hosted; builds and verifies the release artifacts)
        type: boolean
        default: true
      privileged_e2e:
        description: Run privileged-e2e (waits for a [self-hosted, bpf] runner)
        type: boolean
        default: false
permissions:
  contents: read
# Per ref, so a branch that moves cancels its superseded run. Several refs at
# one commit (a release branch, main and the tag) each start a run; the dedupe
# job below lets only the first of them run the check matrix.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The cargo-installed CI tools. Each version is read by both the install step
# and its cache key, so a version bump can never be served an older binary.
env:
  CI_TOOL_BPF_LINKER: 0.10.4
  CI_TOOL_LLVM_COV: 0.9.1
  CI_TOOL_AUDIT: 0.22.2
  CI_TOOL_DENY: 0.20.2
# The hosted checks run as parallel jobs on one commit: lint, audit, tests,
# the contracts shards and scripts (the former single checks-and-e2e job), plus the
# coverage shards and their merged report. Each job repeats the same pinned
# setup: toolchains, apt packages, dependency reconstruction and the explicit
# network fetch run fresh every time. Two things are cached, both keyed by the
# runner image (ImageOS-ImageVersion), so an image update starts them cold:
#   - the cargo-installed tool binaries, keyed by tool, version and the release
#     compiler that built them; a hit skips only that `cargo install`.
#   - in lint, tests and contracts, the build products under target/debug
#     (deps, build, .fingerprint, incremental), keyed by job role, both Rust
#     toolchains, both lockfiles and the apt C toolchain versions, exact key
#     only, saved only by a green job. Checkout and dependency reconstruction
#     give every source a fresh mtime, so cargo rebuilds every workspace and
#     path crate (rustc reuses its incremental state by content hash) and
#     reuses only third-party artifacts it can prove fresh.
# Never cached: ~/.cargo/registry and ~/.cargo/git (a cached copy would let a
# broken fetch still feed the --offline gates), third-party/ (the reconstructed
# trees and their archives, which prepare-dependencies.py must rebuild and
# digest-check every run), test and lane work directories under target/, and
# the coverage build: cargo llvm-cov cleans every workspace member before each
# run, so its cache could only hold dependencies, and stale instrumented
# executables or profiles must never reach the merged report.
# The workspace test gate is ONE command, partitioned by
# scripts/ci-test-partition.py: the tests job runs every target except
# artifact_contracts, and the contracts shards split that target so every
# listed test runs in exactly one shard (each shard proves its count from
# libtest's own summary). Coverage runs the same partition under
# cargo llvm-cov --no-report and merges every shard's profiles and executables
# in coverage-report, which applies the .coverage-floor gate.
jobs:
  # One full check matrix per commit. A push run whose exact commit already
  # passed the full matrix in an earlier push or dispatch run of this workflow
  # skips its check and coverage jobs and names that run in its summary. While
  # an earlier run on the commit is unfinished, this job waits for it (75
  # minutes at most), so a cancelled or failed earlier run never leaves the
  # commit without a result: the matrix then runs here. Pull requests (which
  # test a merge commit) and manual dispatches always run it, and any API
  # error runs it too. A covering run must itself have run lint and
  # coverage-report, so a run that only deduplicated never covers another.
  dedupe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        run: |
          decide() {
            echo "run=$1" >>"$GITHUB_OUTPUT"
            echo "dedupe: $2"
            printf '## dedupe\n\n%s\n' "$2" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            decide true "$GITHUB_EVENT_NAME run: the check matrix runs"
          fi
          api="repos/$GITHUB_REPOSITORY/actions"
          workflow=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .workflow_id) \
            || decide true "cannot read this run; the check matrix runs"
          deadline=$((SECONDS + 75 * 60))
          while :; do
            # Earlier push and dispatch runs of this workflow on this exact
            # commit; a run id is assigned in creation order.
            earlier=$(gh api "$api/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID and (.event == \"push\" or .event == \"workflow_dispatch\")) | \"\(.id) \(.status) \(.conclusion)\"") \
              || decide true "cannot list the runs on $GITHUB_SHA; the check matrix runs"
            active=
            while read -r id status conclusion; do
              [ -n "$id" ] || continue
              if [ "$status" != completed ]; then
                active="$active $id"
              elif [ "$conclusion" = success ]; then
                ran=$(gh api "$api/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select((.name == "lint" or .name == "coverage-report") and .conclusion == "success")] | length') \
                  || ran=0
                if [ "$ran" = 2 ]; then
                  decide false "commit $GITHUB_SHA already passed the full check matrix in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id; this run skips it"
                fi
              fi
            done <<<"$earlier"
            [ -n "$active" ] \
              || decide true "no earlier run covers $GITHUB_SHA; the check matrix runs"
            [ "$SECONDS" -lt "$deadline" ] \
              || decide true "earlier run(s)$active unfinished after 75 minutes; the check matrix runs"
            echo "dedupe: waiting for earlier run(s) on $GITHUB_SHA:$active"
            sleep 60
          done
  # Static gates: formatting, compilation, both clippy profiles, the
  # diagnostic-object inventory test and script lints.
  lint:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline/source custody tests require a self-contained commit graph.
          fetch-depth: 0
      # The stable toolchain is single-sourced from .release-rust-version,
      # read inline like .coverage-floor; crate rust-version tracks its major.minor.
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 shellcheck softhsm2
      # Cache keys (see the header): the runner image, and the apt C toolchain
      # that build scripts invoke.
      - name: Cache keys
        id: keys
        shell: bash
        run: |
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          cc=$(dpkg-query -W -f='${Package}=${Version}\n' clang-18 gcc gcc-multilib libseccomp-dev llvm | sha256sum | cut -c1-16)
          echo "cc=$cc" >>"$GITHUB_OUTPUT"
      # bpf-linker (default feature rust-llvm-22) proxies to the LLVM bundled with the
      # toolchain that runs it (nightly); clang-18 compiles native CO-RE bitcode.
      - id: bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ env.CI_TOOL_BPF_LINKER }}-${{ steps.keys.outputs.image }}-rust-${{ hashFiles('.release-rust-version') }}
      - if: steps.bpf-linker.outputs.cache-hit != 'true'
        run: cargo +"$(cat .release-rust-version)" install bpf-linker --version "$CI_TOOL_BPF_LINKER" --locked
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      # Network acquisition is explicit and precedes every offline validation.
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # Build products only (see the header), restored after the sources are
      # reconstructed and fetched and saved only when this job succeeds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/incremental
          key: target-lint-${{ steps.keys.outputs.image }}-cc-${{ steps.keys.outputs.cc }}-${{ hashFiles('.release-rust-version', 'crates/ebpf/rust-toolchain.toml', 'Cargo.lock', 'crates/ebpf/Cargo.lock') }}
      - name: Verify prepared dependency selection
        shell: bash
        run: |
          . scripts/prepared-dependency-tools.sh
          p11scope_prepared_tools_select "$(command -v python3)" "$(command -v rustup)"
          RUSTC="$P11SCOPE_PREPARED_STABLE_RUSTC" \
            "$P11SCOPE_PREPARED_STABLE_CARGO" metadata --locked --offline --all-features --format-version 1 --manifest-path Cargo.toml >"$RUNNER_TEMP/root-metadata.json"
          RUSTC="$P11SCOPE_PREPARED_BPF_RUSTC" \
            "$P11SCOPE_PREPARED_BPF_CARGO" metadata --locked --offline --all-features --format-version 1 --manifest-path crates/ebpf/Cargo.toml >"$RUNNER_TEMP/bpf-metadata.json"
          "$P11SCOPE_PREPARED_PYTHON" -I scripts/check-prepared-dependencies.py \
            --sources third-party/sources.json \
            --metadata "Cargo.toml=$RUNNER_TEMP/root-metadata.json" \
            --metadata "crates/ebpf/Cargo.toml=$RUNNER_TEMP/bpf-metadata.json" --ledger
      - run: cargo +"$(cat .release-rust-version)" fmt --all -- --check
      - run: cargo +"$(cat .release-rust-version)" check --locked --offline --workspace --all-targets
      - run: cargo +"$(cat .release-rust-version)" clippy --locked --offline --workspace --all-targets -- -D warnings
      # The wide Detailed profile changes the embedded BPF object and the slot
      # bound; lint it so a default-only change cannot break the other profile.
      - run: cargo +"$(cat .release-rust-version)" clippy --locked --offline -p p11scope --all-targets --features wide-detailed-2112 -- -D warnings
      # libtest exits 0 when a filter matches nothing, so this step proves a test
      # actually ran rather than trusting the source to keep naming one. A rename,
      # an #[ignore], a #[cfg] that excludes it, or a deleted #[test] all empty the
      # filter identically, and all of them fail here.
      - shell: bash
        run: |
          cargo +"$(cat .release-rust-version)" test --locked --offline --features unsafe-unvalidated-metadata --test artifact_contracts -- --exact --nocapture frozen_policy_inventory_matches_embedded_object | tee "$RUNNER_TEMP/diagnostic-inventory.log"
          grep -q "^test result: ok. 1 passed" "$RUNNER_TEMP/diagnostic-inventory.log"
      - run: pipx install ruff==0.16.8
      # SYSPLAN residual gates. None names a lane body: the lint step
      # addresses directories through a shell variable, never a scripts/
      # path (the pipeline derivation test forbids lane paths here).
      - name: lint shell scripts (error level)
        shell: bash
        run: |
          for dir in scripts scripts/matrix; do
            shellcheck -S error "$dir"/*.sh
          done
      - run: ruff check scripts/ tests/python/
  # Advisory and licence gates. Their own job because building the two pinned
  # tools takes about five minutes when their cache is cold; nothing here
  # compiles the project, so the job skips bpf-linker and the apt packages but
  # reconstructs the pinned sources and fetches both Cargo roots exactly like
  # every other job.
  audit:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # Cache keys (see the header): the runner image.
      - name: Cache keys
        id: keys
        shell: bash
        run: |
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CI_TOOL_AUDIT }}-${{ steps.keys.outputs.image }}-rust-${{ hashFiles('.release-rust-version') }}
      - if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo +"$(cat .release-rust-version)" install cargo-audit --version "$CI_TOOL_AUDIT" --locked
      - id: cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CI_TOOL_DENY }}-${{ steps.keys.outputs.image }}-rust-${{ hashFiles('.release-rust-version') }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo +"$(cat .release-rust-version)" install cargo-deny --version "$CI_TOOL_DENY" --locked
      - run: cargo +"$(cat .release-rust-version)" audit
      # The host and BPF crates have separate Cargo roots and license policies.
      # The BPF-only GPL-2.0-only allowance must not leak into the host graph.
      - run: cargo +"$(cat .release-rust-version)" deny --locked check
      - run: cargo +"$(cat .release-rust-version)" deny --locked --manifest-path crates/ebpf/Cargo.toml --config deny-ebpf.toml check
  # The workspace test gate minus artifact_contracts (the contracts shards
  # run that target), plus the standalone vendored-dependency unit tests.
  tests:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline/source custody tests require a self-contained commit graph.
          fetch-depth: 0
      # Private TMPDIR on the runner disk: /tmp is a small tmpfs and the test
      # trees exceed its quota (EDQUOT); later steps inherit this via the env.
      - run: mkdir -m 700 "$RUNNER_TEMP/private-tmp" && echo "TMPDIR=$RUNNER_TEMP/private-tmp" >>"$GITHUB_ENV"
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 shellcheck softhsm2
      # Cache keys (see the header): the runner image, and the apt C toolchain
      # that build scripts invoke.
      - name: Cache keys
        id: keys
        shell: bash
        run: |
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          cc=$(dpkg-query -W -f='${Package}=${Version}\n' clang-18 gcc gcc-multilib libseccomp-dev llvm | sha256sum | cut -c1-16)
          echo "cc=$cc" >>"$GITHUB_OUTPUT"
      # bpf-linker (default feature rust-llvm-22) proxies to the LLVM bundled with the
      # toolchain that runs it (nightly); clang-18 compiles native CO-RE bitcode.
      - id: bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ env.CI_TOOL_BPF_LINKER }}-${{ steps.keys.outputs.image }}-rust-${{ hashFiles('.release-rust-version') }}
      - if: steps.bpf-linker.outputs.cache-hit != 'true'
        run: cargo +"$(cat .release-rust-version)" install bpf-linker --version "$CI_TOOL_BPF_LINKER" --locked
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      # Network acquisition is explicit and precedes every offline validation.
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # Build products only (see the header), restored after the sources are
      # reconstructed and fetched and saved only when this job succeeds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/incremental
          key: target-tests-${{ steps.keys.outputs.image }}-cc-${{ steps.keys.outputs.cc }}-${{ hashFiles('.release-rust-version', 'crates/ebpf/rust-toolchain.toml', 'Cargo.lock', 'crates/ebpf/Cargo.lock') }}
      # The aya-p2 tree resolves its aya-obj dependency to the sibling p2
      # tree: its multi-backport needs fields only aya-obj-p2 has, so the
      # vendored upstream lock (crates.io aya-obj) cannot build it. Both
      # standalone steps inject that patch and resolve unlocked; the
      # shipped combination stays locked by the root workspace steps.
      # Resolving unlocked rewrites the tree's vendored Cargo.lock, which is
      # part of the recipe-pinned tree digest that the dependency check below
      # and every later scripts/cargo.sh preparation verify, so each unlocked
      # step restores the recipe's lock before it ends.
      - name: Fetch the standalone aya tree
        shell: bash
        run: |
          cp -p third-party/src/aya-0.14.0-p2/Cargo.lock "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock"
          cargo +"$(cat .release-rust-version)" fetch --config 'patch.crates-io.aya-obj.path="third-party/src/aya-obj-0.3.0-p2"' --manifest-path third-party/src/aya-0.14.0-p2/Cargo.toml
          cp -p "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock" third-party/src/aya-0.14.0-p2/Cargo.lock
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path third-party/src/aya-obj-0.3.0-p2/Cargo.toml
      # The workspace gate, every target but artifact_contracts: the script
      # rewrites --all-targets into --lib --bins --examples --benches plus one
      # --test per integration target from cargo metadata.
      - run: python3 -I scripts/ci-test-partition.py run --partition rest -- cargo +"$(cat .release-rust-version)" test --locked --offline --workspace --all-targets
      - name: Aya dependency unit tests
        env:
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        shell: bash
        run: |
          cargo +"$(cat .release-rust-version)" test --offline --config 'patch.crates-io.aya-obj.path="third-party/src/aya-obj-0.3.0-p2"' --manifest-path third-party/src/aya-0.14.0-p2/Cargo.toml --target-dir target/aya-tests --lib
          cp -p "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock" third-party/src/aya-0.14.0-p2/Cargo.lock
      - run: cargo +"$(cat .release-rust-version)" test --locked --offline --manifest-path third-party/src/aya-obj-0.3.0-p2/Cargo.toml --target-dir target/aya-obj-tests --lib
      - name: Prove the prepared dependency trees are unchanged
        run: python3 -I scripts/prepare-dependencies.py --check
  # The same workspace test gate, narrowed to artifact_contracts and split
  # into shards. Each shard computes the same longest-first plan from the
  # binary's own test list and the checked-in scripts/ci-test-weights.json,
  # runs its share with --exact, and fails unless libtest reports exactly that
  # many tests. The matrix must name every shard 1..N of the N in the command
  # (pinned by hosted_pipeline_partitions_the_workspace_test_gate).
  contracts:
    name: contracts-${{ matrix.shard }}
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline/source custody tests require a self-contained commit graph.
          fetch-depth: 0
      # Private TMPDIR on the runner disk: /tmp is a small tmpfs and the test
      # trees exceed its quota (EDQUOT); later steps inherit this via the env.
      - run: mkdir -m 700 "$RUNNER_TEMP/private-tmp" && echo "TMPDIR=$RUNNER_TEMP/private-tmp" >>"$GITHUB_ENV"
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 shellcheck softhsm2
      # Cache keys (see the header): the runner image, and the apt C toolchain
      # that build scripts invoke.
      - name: Cache keys
        id: keys
        shell: bash
        run: |
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          cc=$(dpkg-query -W -f='${Package}=${Version}\n' clang-18 gcc gcc-multilib libseccomp-dev llvm | sha256sum | cut -c1-16)
          echo "cc=$cc" >>"$GITHUB_OUTPUT"
      # bpf-linker (default feature rust-llvm-22) proxies to the LLVM bundled with the
      # toolchain that runs it (nightly); clang-18 compiles native CO-RE bitcode.
      - id: bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ env.CI_TOOL_BPF_LINKER }}-${{ steps.keys.outputs.image }}-rust-${{ hashFiles('.release-rust-version') }}
      - if: steps.bpf-linker.outputs.cache-hit != 'true'
        run: cargo +"$(cat .release-rust-version)" install bpf-linker --version "$CI_TOOL_BPF_LINKER" --locked
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      # Network acquisition is explicit and precedes every offline validation.
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # Build products only (see the header), restored after the sources are
      # reconstructed and fetched and saved only when this job succeeds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/incremental
          key: target-contracts-${{ steps.keys.outputs.image }}-cc-${{ steps.keys.outputs.cc }}-${{ hashFiles('.release-rust-version', 'crates/ebpf/rust-toolchain.toml', 'Cargo.lock', 'crates/ebpf/Cargo.lock') }}
      - run: python3 -I scripts/ci-test-partition.py run --partition "contracts:${{ matrix.shard }}/8" -- cargo +"$(cat .release-rust-version)" test --locked --offline --workspace --all-targets
  # Every validator --self-test, the two container-less live lanes and every
  # tests/python suite. The UNRUN block is this job's first step after
  # checkout, so the lane list reaches the log even if a later step fails.
  scripts:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline/source custody tests require a self-contained commit graph.
          fetch-depth: 0
      # UNRUN lanes begin
      # Honest scope, printed first so it reaches the log even when a later step
      # fails. A passing --self-test exercises a lane's oracle model, never the
      # lane; a green job never implies these lanes ran. The list is derived
      # (every privileged script under scripts/, minus the ones this job runs
      # in full; spike/ is research, not a release lane) and
      # pinned by hosted_pipeline_names_every_unrun_privileged_lane.
      - shell: bash
        run: |
          # Standalone assignment, not a substitution inside the heredoc: only
          # this form aborts under `set -e`. The tree hash is the wave's exit
          # anchor, so it must never silently render blank.
