[package]
name = "p11scope-discover"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mingulov/pkcs11-scope"
description = "PKCS#11 discovery helper: dlopen a provider, map its function tables to ELF file offsets"
publish = false

[dependencies]
cryptoki-sys = "0.5"
libloading = "0.8"
libc = "0.2"
p11scope-manifest = { path = "../manifest", features = ["identify"] }
pkcs11-module = { git = "https://github.com/mingulov/pkcs11-proxy-ng", rev = "cbf3d019c43cf424d92a5d2033c6714c9f866f65" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
