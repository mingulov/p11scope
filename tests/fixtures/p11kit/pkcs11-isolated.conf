# Isolated p11-kit user config for the transparency cells.
# With XDG_CONFIG_HOME pointed at the directory holding this file's parent
# (i.e. $XDG_CONFIG_HOME/pkcs11/pkcs11.conf), the proxy loads ONLY the
# modules in $XDG_CONFIG_HOME/pkcs11/modules/ and ignores the system
# module directory. Verified on Ubuntu (p11-kit 0.26.2): `p11-kit
# list-modules` shows just the owned spy-wrapped copy. No file under
# /etc or /usr is read for module membership; none is written.
user-config: only
