[package]
name = "p11scope"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mingulov/pkcs11-scope"
description = "Non-interposing PKCS#11 observer on eBPF uprobes (design phase)"
publish = false

[lib]
name = "p11scope"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
aya = "=0.14.0"
p11scope-ebpf-common = { path = "crates/ebpf-common", features = ["user"] }
p11scope-manifest = { path = "crates/manifest", features = ["identify"] }
pkcs11-proxy-ng-types = { git = "https://github.com/mingulov/pkcs11-proxy-ng", rev = "7c5c86043820eb3795f40c65a36ce961cdfd26c5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/discover", "crates/manifest", "crates/ebpf-common"]
