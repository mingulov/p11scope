[package]
name = "p11scope"
version = "0.7.0"
authors = ["Denis Mingulov <denis@mingulov.com>"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/mingulov/p11scope"
description = "Non-interposing PKCS#11 observer on eBPF uprobes"
publish = false

[lib]
name = "p11scope"
path = "src/lib.rs"

[features]
default = ["wide-detailed-2112"]
unsafe-unvalidated-metadata = []
wide-detailed-2112 = ["p11scope-ebpf-common/wide-detailed-2112"]
# P0 explicit option: build the Detailed object with the H7-E4
# attribute gate shut (entry acquires nothing, Get emission reads
# nothing). Official release bytes are FULL (default features) unless
# --capture-mode p0 selects this.
stub-object-attributes = []
# Internal-only diagnostic: attribute every published discovery skip to the
# site that raised it. Stderr only; the capture document is byte-identical
# either way (src/discovery/attribution.rs).
skip-attribution = []
# Internal, bounded stderr metadata for one PID/Singles exec diagnostic.
h6-reexec-diagnostic = []

[dependencies]
anyhow = "1"
aya = "=0.14.0"
aya-obj = "=0.3.0"
cryptoki-sys = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
p11scope-bpf-multi = { version = "0.0.0", path = "crates/bpf-multi" }
p11scope-ebpf-common = { version = "0.0.0", path = "crates/ebpf-common", features = ["user"] }
p11scope-manifest = { version = "0.0.0", path = "crates/manifest", features = ["identify"] }
pkcs11-module = "0.2.3"
pkcs11-types = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.4", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
p11scope-discover = { version = "0.7.0", path = "crates/discover" }
sha2 = "=0.11.0"
tempfile = "3"

[build-dependencies]
sha2 = "=0.11.0"

[workspace]
members = ["crates/discover", "crates/manifest", "crates/ebpf-common", "crates/bpf-multi"]
exclude = ["third-party/src/aya-0.14.0-p2", "third-party/src/aya-obj-0.3.0-p2"]

[patch.crates-io]
aya = { path = "third-party/src/aya-0.14.0-p2" }
aya-obj = { path = "third-party/src/aya-obj-0.3.0-p2" }

[profile.test]
# Tests pin/identify their own executable as a fixture object. Even line
# tables exceed the product's 256 MiB cap as the suite grows, so strip debug
# info only. ELF symbols and LLVM coverage maps remain; backtraces lose
# file:line detail. Product build profiles and object limits are unchanged.
debug = "line-tables-only"
strip = "debuginfo"
