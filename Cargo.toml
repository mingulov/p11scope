[package]
name = "p11scope"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/mingulov/p11scope"
description = "Non-interposing PKCS#11 observer on eBPF uprobes"
publish = false

[lib]
name = "p11scope"
path = "src/lib.rs"

[features]
unsafe-unvalidated-metadata = []
# Internal-only diagnostic: attribute every published discovery skip to the
# site that raised it. Stderr only; the capture document is byte-identical
# either way (src/discovery/attribution.rs).
skip-attribution = []

[dependencies]
anyhow = "1"
aya = "=0.14.0"
cryptoki-sys = "0.5"
libc = "0.2"
p11scope-ebpf-common = { path = "crates/ebpf-common", features = ["user"] }
p11scope-manifest = { path = "crates/manifest", features = ["identify"] }
pkcs11-module = { git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2" }
pkcs11-types = { git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.4", default-features = false }

[dev-dependencies]
aya-obj = "=0.3.0"
p11scope-discover = { path = "crates/discover" }
sha2 = "=0.11.0"
tempfile = "3"

[workspace]
members = ["crates/discover", "crates/manifest", "crates/ebpf-common"]
exclude = ["third-party/src/aya-0.14.0-p1", "third-party/src/aya-obj-0.3.0-p1"]

[patch.crates-io]
aya = { path = "third-party/src/aya-0.14.0-p1" }
aya-obj = { path = "third-party/src/aya-obj-0.3.0-p1" }
