# Merge p11-kit user config for the transparency cells.
# With XDG_CONFIG_HOME pointed at the directory holding this file's parent,
# the proxy loads the system modules PLUS the modules in
# $XDG_CONFIG_HOME/pkcs11/modules/. This is the realistic, large case:
# the owned spy-wrapped copy sits beside the distro modules. Verified on
# Ubuntu (p11-kit 0.26.2): `p11-kit list-modules` shows the system set
# plus the owned module. (The system default is also merge, but stating
# it keeps the cell independent of distro defaults.)
user-config: merge
