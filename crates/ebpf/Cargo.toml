[package]
name = "p11scope-ebpf"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[features]
wide-detailed-2112 = ["p11scope-ebpf-common/wide-detailed-2112"]
stub-object-attributes = ["p11scope-ebpf-common/stub-object-attributes"]
# Private fixed-capacity artifacts, never selected by the observer yet.
# These features do not forward a larger endpoint/RV capacity to common.
counter-broad = []
counter-counts = ["counter-broad"]
counter-timestamps = ["counter-broad"]
counter-latency = ["counter-broad"]
counts-bank-proof = ["counter-counts"]
# Timing bank objects share the counts Rust shape (CountStats STATS and the
# ordinary counter maps); the mode selects the native bank unit, the timed
# roots and the bank geometry.
timestamps-bank-proof = ["counter-counts"]
latency-bank-proof = ["counter-counts"]
inventory-only = []
inventory-callers = ["inventory-only"]
small-ring = ["p11scope-ebpf-common/small-ring"]
small-state-maps = ["p11scope-ebpf-common/small-state-maps"]
small-discovery-ring = ["p11scope-ebpf-common/small-discovery-ring"]
unsafe-unvalidated-metadata = []

[dependencies]
aya-ebpf = "=0.2.1"
p11scope-ebpf-common = { version = "0.0.0", path = "../ebpf-common" }

[[bin]]
name = "p11scope-ebpf"
path = "src/main.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[workspace]
