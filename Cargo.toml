[package]
name = "p11scope"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/mingulov/p11scope"
description = "Non-interposing PKCS#11 observer on eBPF uprobes"
publish = false

[lib]
name = "p11scope"
path = "src/lib.rs"

[features]
unsafe-unvalidated-metadata = []
wide-detailed-2112 = ["p11scope-ebpf-common/wide-detailed-2112"]
# Internal-only diagnostic: attribute every published discovery skip to the
# site that raised it. Stderr only; the capture document is byte-identical
# either way (src/discovery/attribution.rs).
skip-attribution = []

[dependencies]
anyhow = "1"
aya = "=0.14.0"
cryptoki-sys = "0.5"
libc = "0.2"
p11scope-bpf-multi = { version = "0.0.0", path = "crates/bpf-multi" }
p11scope-ebpf-common = { version = "0.0.0", path = "crates/ebpf-common", features = ["user"] }
p11scope-manifest = { version = "0.0.0", path = "crates/manifest", features = ["identify"] }
pkcs11-module = { version = "0.2.0", git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2" }
pkcs11-types = { version = "0.2.0", git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.4", default-features = false }

[dev-dependencies]
aya-obj = "=0.3.0"
p11scope-discover = { version = "0.2.1", path = "crates/discover" }
sha2 = "=0.11.0"
tempfile = "3"

[build-dependencies]
sha2 = "=0.11.0"

[workspace]
members = ["crates/discover", "crates/manifest", "crates/ebpf-common", "crates/bpf-multi"]
exclude = ["third-party/src/aya-0.14.0-p2", "third-party/src/aya-obj-0.3.0-p2"]

[patch.crates-io]
aya = { path = "third-party/src/aya-0.14.0-p2" }
aya-obj = { path = "third-party/src/aya-obj-0.3.0-p2" }

[profile.test]
# 0b: line tables only. Full debuginfo pushes the lib unit-test
# binary past the product's 256 MiB MAX_OBJECT_BYTES cap, and many
# tests pin/identify their own test binary as a fixture object.
# Backtraces keep file:line; variable inspection in tests is reduced.
debug = "line-tables-only"
