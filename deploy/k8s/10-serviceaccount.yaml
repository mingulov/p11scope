# Observer identity with no API access: there is no Role or RoleBinding, and
# the token is never mounted. The observer reads only node-local state
# (/proc via hostPID, the cgroup hierarchy, BPF); pod -> cgroup resolution is
# by pod UID from the node's cgroupfs (scripts/k8s-profile-entry.sh), so the
# operator's own kubectl credentials do the API lookup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p11scope-observer
  namespace: p11scope
  labels:
    app.kubernetes.io/name: p11scope
    app.kubernetes.io/component: observer
automountServiceAccountToken: false
