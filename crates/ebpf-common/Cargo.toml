[package]
name = "p11scope-ebpf-common"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Userspace side needs aya's Pod impls; the kernel side must stay no_std.
user = ["dep:aya"]
# Shrinks only the ring for the event-loss induced-gap test.
small-ring = []
# Shrinks START and RV_COUNTS for their independent induced-gap tests.
small-state-maps = []

[dependencies]
aya = { version = "=0.14.0", optional = true }
