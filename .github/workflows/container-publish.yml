name: container-publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-publish
  cancel-in-progress: false
jobs:
  # Publish the observer image from the release assets: the musl tarball,
  # SHA256SUMS and RELEASE.json for the tag are downloaded, the checksums
  # are verified (RELEASE.json before it is parsed) and the RELEASE tree,
  # head ancestry and version are asserted against the tag commit, with
  # the packaged head bound to the RELEASE tree and unsafe tarball
  # members refused, then
  # the reconciled release Dockerfile builds with --network=none after
  # pulling its pinned base by digest. The smoke runs the image with the
  # documented measured flags (--version with a tag match, doctor, a short
  # inventory --system with SoftHSM on the runner) and the permanent cell
  # proves capture on the built bytes. Nothing here pushes: the push job
  # owns the registry write, final-tag-gated. Every v* tag of this
  # repository builds and smokes, so release candidates validate (including
  # the login) without publishing.
  build:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mingulov/p11scope' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the publish checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - run: sudo apt-get update && sudo apt-get install -y file gcc python3 softhsm2
      - name: Download and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          tag="$GITHUB_REF_NAME"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          gh release download "$tag" --repo "mingulov/p11scope" --dir "$assets" --clobber \
            --pattern 'p11scope-[0-9]*-x86_64-linux-musl.tar.gz' \
            --pattern 'RELEASE.json' --pattern 'SHA256SUMS'
          cd "$assets"
          release_sha256=$(awk '$2 == "RELEASE.json" {print $1}' SHA256SUMS)
          test -n "$release_sha256"
          printf '%s  %s\n' "$release_sha256" RELEASE.json | sha256sum --check
          release_vars=$(python3 -I - RELEASE.json <<'PY'
          import json
          import shlex
          release = json.load(open("RELEASE.json", encoding="utf-8"))
          for key in ("head", "tree", "version"):
              print(f"release_{key}={shlex.quote(str(release[key]))}")
          PY
          )
          eval "$release_vars"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_SHA^{tree}")" = "$release_tree"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$release_head^{tree}")" = "$release_tree"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$release_head" "$GITHUB_SHA"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$release_version" = "${tag_version%%-*}"
          echo "RELEASE ok: version $release_version, tree ${release_tree:0:12}, head ${release_head:0:12}"
          set -- p11scope-[0-9]*-x86_64-linux-musl.tar.gz
          test "$#" -eq 1
          test -f "$1"
          tarball="$1"
          tarball_sha256=$(awk -v want="$tarball" '$2 == want {print $1}' SHA256SUMS)
          test -n "$tarball_sha256"
          printf '%s  %s\n' "$tarball_sha256" "$tarball" | sha256sum --check
          # The runner tar is GNU tar: it lists raw member names, unlike the
          # busybox tar in the image build. List to files (a pipefail grep -q
          # would skew on SIGPIPE) and refuse absolute or parent-climbing
          # members.
          tar --version >"$RUNNER_TEMP/tar-version.txt"
          grep -q 'GNU tar' "$RUNNER_TEMP/tar-version.txt"
          tar -tzf "$tarball" >"$RUNNER_TEMP/tarball-members.txt"
          if grep -qE '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/tarball-members.txt"; then echo "tarball has unsafe members" >&2; exit 1; fi
          echo "$tarball" >"$RUNNER_TEMP/observer-tarball-name.txt"
          echo "$tarball_sha256" >"$RUNNER_TEMP/observer-tarball-sha256.txt"
          ctx="$RUNNER_TEMP/container-publish-ctx"
          mkdir -p "$ctx/scripts"
          cp "$assets/$tarball" "$ctx/"
          cp "$GITHUB_WORKSPACE/scripts/k8s-profile-entry.sh" "$ctx/scripts/"
          latest=$(git -C "$GITHUB_WORKSPACE" tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$tag" = "$latest" ]; then
            echo "true" >"$RUNNER_TEMP/is-latest.txt"
          else
            echo "false" >"$RUNNER_TEMP/is-latest.txt"
          fi
          echo "tag $tag (latest stable: ${latest:-none}, is-latest: $(cat "$RUNNER_TEMP/is-latest.txt"))"
      - name: Build the observer image with no network
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          bases=$(sed -n 's/^FROM //p' deploy/Dockerfile.observer-release | awk '{print $1}')
          test -n "$bases"
          # The runtime stage is FROM scratch: nothing to pull. Every other
          # base must be digest-pinned and is pulled exactly once.
          pulls=$(printf '%s\n' "$bases" | grep -v '^scratch$' || true)
          test -n "$pulls"
          if printf '%s\n' "$pulls" | grep -vq '@sha256:'; then
            echo "a base is not digest-pinned:" >&2
            printf '%s\n' "$pulls" >&2
            exit 1
          fi
          printf '%s\n' "$pulls" | sort -u | xargs -r -I{} docker pull {}
          tarball=$(cat "$RUNNER_TEMP/observer-tarball-name.txt")
          tarball_sha256=$(cat "$RUNNER_TEMP/observer-tarball-sha256.txt")
          docker build --network=none -f deploy/Dockerfile.observer-release \
            --build-arg "TARBALL=$tarball" --build-arg "TARBALL_SHA256=$tarball_sha256" \
            -t p11scope-observer:preview "$RUNNER_TEMP/container-publish-ctx"
          docker inspect --format '{{.Id}}' p11scope-observer:preview \
            | tee "$RUNNER_TEMP/image-id.txt"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/image-id.txt"
      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export SOFTHSM2_CONF="$RUNNER_TEMP/container-publish-softhsm2.conf"
          mkdir -m 700 "$RUNNER_TEMP/container-publish-tokens"
          printf 'directories.tokendir = %s/container-publish-tokens\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP" >"$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label smoke --so-pin 5678 --pin 1234
          v="${GITHUB_REF_NAME#v}"
          expected="p11scope ${v%%-*}"
          actual=$(docker run --rm p11scope-observer:preview --version | head -n 1)
          test "$actual" = "$expected"
          echo "version ok: $actual"
          flags=(--pid=host --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add DAC_READ_SEARCH)
          if [ -r /sys/module/apparmor/parameters/enabled ] \
            && grep -q Y /sys/module/apparmor/parameters/enabled 2>/dev/null; then
            flags+=(--security-opt apparmor=unconfined)
          fi
          flags+=(-v /sys/fs/cgroup:/sys/fs/cgroup:ro)
          set +e
          docker run --rm "${flags[@]}" p11scope-observer:preview doctor >smoke-doctor.txt 2>&1
          code=$?
          set -e
          cat smoke-doctor.txt
          test "$code" -eq 0 -o "$code" -eq 1
          grep -q '^Doctor:' smoke-doctor.txt
          docker run --rm "${flags[@]}" p11scope-observer:preview \
            inventory --system --duration 15 --json >smoke-inventory.json 2>smoke-inventory.err
          echo "inventory exit=$?"
          python3 -I - smoke-inventory.json smoke-inventory.err <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          document = json.loads(Path(sys.argv[1]).read_text())
          assert document.get("schema") == "p11scope/inventory/v1", "inventory schema"
          scanned = [int(value) for value in re.findall(r"([0-9]+) scanned", Path(sys.argv[2]).read_text())]
          assert scanned and max(scanned) > 0, "the smoke must scan host processes"
          print(f"smoke ok: schema p11scope/inventory/v1, scanned {max(scanned)}")
          PY
      - name: Prove capture on the built bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          bash scripts/matrix/verify-container-image.sh --image p11scope-observer:preview \
            --out "$RUNNER_TEMP/cell"
          test -s "$RUNNER_TEMP/cell/results.jsonl"
          python3 -I scripts/ci/check-cell-results.py "$RUNNER_TEMP/cell/results.jsonl" \
            --require host-exact --require container-exact \
            --require refusal-pidns --require refusal-cap
      - name: Save the image for the push job
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          out="$RUNNER_TEMP/container-publish-out"
          mkdir -p "$out"
          docker save p11scope-observer:preview -o "$out/observer.tar"
          cp "$RUNNER_TEMP/image-id.txt" "$out/image-id.txt"
          cp "$RUNNER_TEMP/is-latest.txt" "$out/is-latest.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-publish-tarball
          path: ${{ runner.temp }}/container-publish-out/
          if-no-files-found: error
          retention-days: 30
  # The only registry write: the exact tarball bytes the build job saved,
  # re-identified by image ID after loading, published to
  # ghcr.io/mingulov/p11scope only when this run was triggered on a final
  # release tag (vX.Y.Z, this repository). Prerelease tags (vX.Y.Z-...)
  # load, check the image ID and prove the login, then stop without
  # tagging or pushing; any other v* tag fails closed. The version tag is
  # refused when it already exists (a re-push would overwrite it with
  # different bytes); :latest publishes only when the tag is the newest
  # stable. packages: write is scoped to this job; the top level stays
  # read-only and this job checks out nothing.
  push:
    needs: build
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mingulov/p11scope' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-publish-tarball
          path: ./publish-in
      - name: Push the exact built image on the release tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          cd publish-in
          test -f observer.tar && test -f image-id.txt && test -f is-latest.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' image-id.txt
          docker load -i observer.tar
          loaded=$(docker inspect --format '{{.Id}}' p11scope-observer:preview)
          test "$loaded" = "$(cat image-id.txt)"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final release tag $GITHUB_REF_NAME: publishing"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            echo "prerelease tag $GITHUB_REF_NAME: build and smoke only, not publishing"
            {
              echo "image: (not published: prerelease $GITHUB_REF_NAME)"
              echo "source: $GITHUB_SHA"
            } | tee receipt.txt
            {
              echo "## container-publish"
              echo ""
              echo "prerelease \`$GITHUB_REF_NAME\` from \`$GITHUB_SHA\`: validated, not published."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "refusing: tag $GITHUB_REF_NAME is not a version tag" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version_dest="ghcr.io/mingulov/p11scope:$tag"
          latest_dest="ghcr.io/mingulov/p11scope:latest"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          if docker buildx imagetools inspect "$version_dest" >existing-inspect.txt 2>&1; then
            existing=$(grep -o 'sha256:[0-9a-f]\{64\}' existing-inspect.txt | head -1)
            echo "refusing: $version_dest already exists (${existing:-unknown digest})" >&2
            exit 1
          elif ! grep -q ': not found' existing-inspect.txt; then
            echo "refusing: probe of $version_dest failed unexpectedly" >&2
            cat existing-inspect.txt >&2
            exit 1
          fi
          docker tag p11scope-observer:preview "$version_dest"
          docker push "$version_dest"
          version_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$version_dest")
          test -n "$version_digest"
          if [ "$(cat is-latest.txt)" = "true" ]; then
            docker tag p11scope-observer:preview "$latest_dest"
            docker push "$latest_dest"
            latest_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$latest_dest")
            test -n "$latest_digest"
            test "$version_digest" = "$latest_digest"
            {
              echo "image: $version_dest"
              echo "image: $latest_dest"
              echo "digest: $version_digest"
              echo "source: $GITHUB_SHA"
            } | tee receipt.txt
            {
              echo "## container-publish"
              echo ""
              echo "published \`$version_dest\` and \`$latest_dest\` \`$version_digest\` from \`$GITHUB_SHA\`."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "not the newest stable: skipping :latest"
            {
              echo "image: $version_dest"
              echo "digest: $version_digest"
              echo "source: $GITHUB_SHA"
            } | tee receipt.txt
            {
              echo "## container-publish"
              echo ""
              echo "published \`$version_dest\` \`$version_digest\` from \`$GITHUB_SHA\` (not newest stable, :latest skipped)."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-publish-receipt
          path: ./publish-in/receipt.txt
          if-no-files-found: error
          retention-days: 30
