name: package-preview
on:
  workflow_dispatch:
    inputs:
      accepted_ci_run_id:
        description: Completed successful ci.yml run on this exact commit (positive decimal ID)
        type: string
        required: true
      capture_mode:
        description: Official package modes to build
        type: choice
        options: [full, p0, both]
        default: both
      jobs:
        description: Cargo build jobs (canonical integer 1 through 16)
        type: string
        default: '2'
  workflow_call:
    inputs:
      accepted_ci_run_id:
        description: Completed successful ci.yml run on this exact commit (positive decimal ID)
        type: string
        required: true
      capture_mode:
        description: Official package modes to build
        type: string
        default: both
      jobs:
        description: Cargo build jobs (canonical integer 1 through 16)
        type: string
        default: '2'
permissions:
  contents: read
  actions: read
env:
  CI_TOOL_BPF_LINKER: 0.10.4
jobs:
  validate:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.accept.outputs.sha }}
      tree: ${{ steps.accept.outputs.tree }}
      jobs: ${{ steps.accept.outputs.jobs }}
      matrix: ${{ steps.accept.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate accepted ordinary CI
        id: accept
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          ACCEPTED_CI_RUN_ID: ${{ inputs.accepted_ci_run_id }}
          CAPTURE_MODE: ${{ inputs.capture_mode }}
          BUILD_JOBS: ${{ inputs.jobs }}
        shell: bash
        run: |
          set -euo pipefail
          accepted=$(python3 -I scripts/check-package-preview-ci.py \
            --repository "$EXPECTED_REPOSITORY" --sha "$EXPECTED_SHA" \
            --accepted-ci-run-id "$ACCEPTED_CI_RUN_ID" \
            --capture-mode "$CAPTURE_MODE" --jobs "$BUILD_JOBS")
          printf '%s\n' "$accepted" >>"$GITHUB_OUTPUT"
  package:
    name: package-${{ matrix.mode }}
    needs: validate
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      EXPECTED_TREE: ${{ needs.validate.outputs.tree }}
      CAPTURE_MODE: ${{ matrix.mode }}
      BUILD_JOBS: ${{ needs.validate.outputs.jobs }}
      PUBLIC_DIRECTORY: ${{ matrix.public }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify package checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: rustup target add --toolchain "$(cat .release-rust-version)" x86_64-unknown-linux-musl
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version "$CI_TOOL_BPF_LINKER" --locked --jobs "$BUILD_JOBS"
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm musl-tools python3 python3-yaml rpm softhsm2
      - name: Install packaged bpftool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y linux-tools-generic
          if bpftool_files=$(dpkg-query -L bpftool 2>/dev/null); then
            bpftool_source=$(printf '%s\n' "$bpftool_files" | grep -Ex '/usr/(sbin|bin)/bpftool')
          else
            status=$?
            [[ "$status" -eq 1 ]]
            tools_package=$(dpkg-query -W -f='${Depends}' linux-tools-generic)
            [[ "$tools_package" =~ ^linux-tools-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$ ]]
            bpftool_source="/usr/lib/linux-tools/${tools_package#linux-tools-}/bpftool"
            bpftool_files=$(dpkg-query -L "$tools_package")
            grep -Fxq -- "$bpftool_source" <<< "$bpftool_files"
          fi
          test -f "$bpftool_source"
          test -x "$bpftool_source"
          sudo install -m 0755 "$bpftool_source" /usr/local/bin/bpftool
          bpftool version
          sudo bpftool version
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # These are the existing release-preview pins; no build or capture logs
      # leave this runner. The official builder retains every final-byte gate.
      - name: Download verified package tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/release-tools"
          mkdir -m 700 "$tools"
          curl -fsSL --retry 3 -o "$tools/cargo-about.tar.gz" \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $tools/cargo-about.tar.gz" | sha256sum --check
          tar -xzf "$tools/cargo-about.tar.gz" -C "$tools" \
            cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
          install -m 0755 "$tools/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" "$tools/cargo-about"
          curl -fsSL --retry 3 -o "$tools/musl-1.2.5.tar.gz" \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz
          echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  $tools/musl-1.2.5.tar.gz" | sha256sum --check
      - name: Build and assemble public package
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          evidence="$RUNNER_TEMP/release-evidence"
          mkdir -m 700 "$evidence"
          TMPDIR="$evidence" scripts/build-release.sh \
            --capture-mode "$CAPTURE_MODE" --jobs "$BUILD_JOBS" "$evidence/receipt"
          python3 -I scripts/export-source.py --output "$evidence/source.tar.gz"
          python3 -I scripts/release-notices.py \
            --cargo-about "$RUNNER_TEMP/release-tools/cargo-about" \
            --musl-archive "$RUNNER_TEMP/release-tools/musl-1.2.5.tar.gz" \
            --output "$evidence/notices"
          python3 -I scripts/package-release.py \
            --capture-mode "$CAPTURE_MODE" --receipt "$evidence/receipt" \
            --notices "$evidence/notices" --source "$evidence/source.tar.gz" \
            --output "$evidence/$PUBLIC_DIRECTORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-evidence/${{ matrix.public }}/
          if-no-files-found: error
          retention-days: 30
  attest:
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-preview-public-assets*
          path: ./attested
          merge-multiple: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './attested/**/*'
  install-test:
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.capture_mode != 'p0'
        with:
          name: release-preview-public-assets
          path: ./install-test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.capture_mode == 'p0'
        with:
          name: release-preview-public-assets-p0
          path: ./install-test
      - name: Install and smoke-test the DEB package
        shell: bash
        run: |
          set -euo pipefail
          cd install-test
          sha256sum --check SHA256SUMS
          sudo apt-get install -y ./p11scope_*.deb
          p11scope --version
          set +e
          sudo p11scope doctor >doctor.txt 2>&1
          code=$?
          set -e
          cat doctor.txt
          test "$code" -eq 0 -o "$code" -eq 1
          grep -q '^Doctor:' doctor.txt
          p11scope-discover --version
          sudo apt-get remove -y p11scope
          test ! -e /usr/bin/p11scope
          test ! -e /usr/bin/p11scope-discover
      - name: Install and smoke-test the RPM package in Fedora
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/install-test:/work:ro" fedora:44 bash -c '
            set -euo pipefail
            cd /work
            sha256sum --check SHA256SUMS
            dnf install -y ./p11scope-*.rpm
            p11scope --version
            set +e
            p11scope doctor >/tmp/doctor.txt 2>&1
            code=$?
            set -e
            cat /tmp/doctor.txt
            test "$code" -eq 0 -o "$code" -eq 1
            grep -q "^Doctor:" /tmp/doctor.txt
            p11scope-discover --version
            dnf remove -y p11scope
            test ! -e /usr/bin/p11scope
            test ! -e /usr/bin/p11scope-discover
          '
  # The observer image recipe, qualified here from the packaged FULL musl
  # tarball: the FULL public package is verified, the observer tarball is
  # selected and its static-pie shape is checked, then the release
  # Dockerfile builds with --network=none after the pinned base is pulled
  # by digest, so no binary is fetched and no dev build can leak in. The
  # smoke runs the image with the documented measured flags (--version,
  # doctor, a short inventory --system with SoftHSM on the runner). Deep
  # positives (exact counts, attribution, refusals) live in the permanent
  # privileged-tests container-image cell, not here. The image holds the
  # FULL bytes, so this job waits for the whole package matrix: like the
  # release, a P0 failure withholds the image. A p0-only dispatch has no
  # FULL bytes and skips the job instead of building from anything else.
  # Nothing here pushes: registry publishing lives in the release-triggered
  # container-publish workflow, so this reusable workflow (called by
  # ordinary push CI) never needs packages:write.
  container-image:
    needs: package
    if: ${{ inputs.capture_mode != 'p0' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preview-public-assets
          path: ./container-package
      - name: Verify and stage the packaged FULL musl observer
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          cd container-package
          sha256sum --check SHA256SUMS
          set -- p11scope-[0-9]*-x86_64-linux-musl.tar.gz
          test "$#" -eq 1
          test -f "$1"
          tarball="$1"
          tarball_sha256=$(awk -v want="$tarball" '$2 == want {print $1}' SHA256SUMS)
          test -n "$tarball_sha256"
          printf '%s  %s\n' "$tarball_sha256" "$tarball" | sha256sum --check
          echo "$tarball" >"$RUNNER_TEMP/observer-tarball-name.txt"
          echo "$tarball_sha256" >"$RUNNER_TEMP/observer-tarball-sha256.txt"
          check="$RUNNER_TEMP/tarball-static-check"
          rm -rf "$check"
          mkdir -p "$check"
          tar -xzf "$tarball" -C "$check"
          set -- "$check"/p11scope-[0-9]*-x86_64-linux-musl/p11scope
          test "$#" -eq 1
          test -f "$1" && test -x "$1" && test ! -L "$1"
          file -b "$1" | grep -q "static-pie linked"
          sha256sum "$1" | tee "$RUNNER_TEMP/packaged-observer.sha256"
          ctx="$RUNNER_TEMP/container-image-ctx"
          mkdir -p "$ctx/scripts"
          cp "$tarball" "$ctx/"
          cp "$GITHUB_WORKSPACE/scripts/k8s-profile-entry.sh" "$ctx/scripts/"
      - name: Build the observer image with no network
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          base=$(sed -n 's/^FROM //p' deploy/Dockerfile.observer-release)
          test -n "$base"
          test "$(printf '%s\n' "$base" | wc -l)" -eq 1
          case "$base" in *@sha256:*) ;; *) echo "base is not digest-pinned: $base" >&2; exit 1 ;; esac
          docker pull "$base"
          tarball=$(cat "$RUNNER_TEMP/observer-tarball-name.txt")
          tarball_sha256=$(cat "$RUNNER_TEMP/observer-tarball-sha256.txt")
          docker build --network=none -f deploy/Dockerfile.observer-release \
            --build-arg "TARBALL=$tarball" --build-arg "TARBALL_SHA256=$tarball_sha256" \
            -t p11scope-observer:preview "$RUNNER_TEMP/container-image-ctx"
          docker inspect --format '{{.Id}}' p11scope-observer:preview \
            | tee "$RUNNER_TEMP/image-id.txt"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/image-id.txt"
      - run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export SOFTHSM2_CONF="$RUNNER_TEMP/container-image-softhsm2.conf"
          mkdir -m 700 "$RUNNER_TEMP/container-image-tokens"
          printf 'directories.tokendir = %s/container-image-tokens\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP" >"$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label smoke --so-pin 5678 --pin 1234
          docker run --rm p11scope-observer:preview --version
          flags=(--pid=host --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add DAC_READ_SEARCH)
          if [ -r /sys/module/apparmor/parameters/enabled ] \
            && grep -q Y /sys/module/apparmor/parameters/enabled 2>/dev/null; then
            flags+=(--security-opt apparmor=unconfined)
          fi
          flags+=(-v /sys/fs/cgroup:/sys/fs/cgroup:ro)
          set +e
          docker run --rm "${flags[@]}" p11scope-observer:preview doctor >smoke-doctor.txt 2>&1
          code=$?
          set -e
          cat smoke-doctor.txt
          test "$code" -eq 0 -o "$code" -eq 1
          grep -q '^Doctor:' smoke-doctor.txt
          docker run --rm "${flags[@]}" p11scope-observer:preview \
            inventory --system --duration 15 --json >smoke-inventory.json 2>smoke-inventory.err
          echo "inventory exit=$?"
          python3 -I - smoke-inventory.json smoke-inventory.err <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          document = json.loads(Path(sys.argv[1]).read_text())
          assert document.get("schema") == "p11scope/inventory/v1", "inventory schema"
          scanned = [int(value) for value in re.findall(r"([0-9]+) scanned", Path(sys.argv[2]).read_text())]
          assert scanned and max(scanned) > 0, "the smoke must scan host processes"
          print(f"smoke ok: schema p11scope/inventory/v1, scanned {max(scanned)}")
          PY
      - name: Save the smoke-tested image
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          out="$RUNNER_TEMP/container-image-out"
          mkdir -p "$out"
          docker save p11scope-observer:preview -o "$out/observer.tar"
          cp "$RUNNER_TEMP/image-id.txt" "$out/image-id.txt"
          cp "$RUNNER_TEMP/packaged-observer.sha256" "$out/packaged-observer.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image-tarball
          path: ${{ runner.temp }}/container-image-out/
          if-no-files-found: error
          retention-days: 30
