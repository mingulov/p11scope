[package]
name = "p11scope-discover"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/mingulov/p11scope"
description = "PKCS#11 discovery helper: dlopen a provider, map its function tables to ELF file offsets"
publish = false

[dependencies]
cryptoki-sys = "0.5"
libloading = "0.9"
libc = "0.2"
p11scope-manifest = { version = "0.0.0", path = "../manifest", features = ["identify"] }
pkcs11-module = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
