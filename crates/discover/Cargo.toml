[package]
name = "p11scope-discover"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/mingulov/p11scope"
description = "PKCS#11 discovery helper: dlopen a provider, map its function tables to ELF file offsets"
publish = false

[dependencies]
cryptoki-sys = "0.5"
libloading = "0.8"
libc = "0.2"
p11scope-manifest = { version = "0.0.0", path = "../manifest", features = ["identify"] }
pkcs11-module = { version = "0.2.0", git = "https://github.com/mingulov/pkcs11-components", rev = "d0a47c71d34294466bc41100ae6b5a5a329029d2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
