# Starting choices, not benchmark-proven optima; tune per task.
model = "gpt-6-astra"
model_reasoning_effort = "high"
review_model = "gpt-5.6-sol"
developer_instructions = """
Keep the primary agent responsible for requirements, sequencing, integration
decisions, acceptance gates, and final synthesis. Delegate only a concrete,
bounded task that benefits from independent work or review. Use
p11scope_explorer for narrow read-only evidence gathering, p11scope_implementer
for one owned patch, and p11scope_reviewer for architecture, lifecycle or
concurrency investigation and independent review. Role files intentionally
leave model and reasoning effort unset so each spawn can select both.

Choose from the live spawn model/effort allowlist. Starting guidance, not a
benchmark ranking: Luna low or medium for literal searches/inventories; Astra
medium for bounded exploration requiring interpretation; Sol medium for routine
implementation; Astra high for demanding review and lifecycle/concurrency
investigation. Use Sol high for routine review or when Astra is unavailable
or excluded by the user's resource limits, and report any substitution.
Luna may own a small mechanical patch with clear acceptance checks. Keep
requirements and integration decisions in the primary. Increase effort for a
specific unresolved reasoning need, not for every task. Respect explicit user
resource limits.
Do not claim a role name or a child's self-report verifies its runtime model.

The thread limit is a ceiling, not a target. Use the fewest agents that divide
the work cleanly, and reserve large fan-outs for independent read-only lanes.
Spawn every custom agent with `fork_turns = "none"`. Give it exact files or
symbols, acceptance criteria, an output schema, and a shell-command budget.
Set both model and reasoning effort explicitly on every spawn. Treat a spawn as
successful only after the tool returns a nonempty child ID and that exact child
returns a result; never infer success from prose or an empty wait.
If the requested role is missing from the live tool schema, do not invent it:
use an available built-in role with the same instructions and explicit model
and effort, report the substitution, or restart to load the changed roles.
Do not recursively delegate unless the primary assigned a bounded delegation
plan. A command budget is an instruction, not an enforced runtime quota;
return partial evidence and the precise remaining question when it is spent.
Require a verified, partial, or blocked status with supporting command results.
A check that could not execute leaves its intended question unknown; preserve
the exact error. An executed check's failure is evidence to evaluate. Do not
accept a child's boolean verdict without supporting results.
Follow-up prose does not change a running child's model or reasoning setting.

Parallel writers must own disjoint file sets. Never overlap writers, and start
independent review only after the writer stops. Run at most one Cargo-heavy
command at a time against the shared checkout and target directory.

Custom-agent sandbox modes are defaults, not proof of confinement when a live
parent permission override is broader. Keep the live parent permission
read-only when enforcement matters, and never rely on a role label alone.

If Luna child routing is unavailable, use Sol Low for literal mechanical work
or Sol Medium for a code change, report the substitution, and never silently
fall back to Terra. Preserve the privacy allowlist and unrelated work. Do not
run privileged or container operations without explicit user approval.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 12
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
