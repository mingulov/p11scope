name: ci
on:
  push:
  pull_request:
  # Manual runs from the Actions tab. The two dispatch-only jobs below run
  # only when their input is selected; every other job runs as on push.
  workflow_dispatch:
    inputs:
      release_preview:
        description: Run release-preview (hosted; builds and verifies the release artifacts)
        type: boolean
        default: true
      privileged_e2e:
        description: Run privileged-e2e (waits for a [self-hosted, bpf] runner)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks-and-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline/source custody tests require a self-contained commit graph.
          fetch-depth: 0
      # UNRUN lanes begin
      # Honest scope, printed first so it reaches the log even when a later step
      # fails. A passing --self-test exercises a lane's oracle model, never the
      # lane; a green job never implies these lanes ran. The list is derived
      # (every privileged script under scripts/, minus the ones this job runs
      # in full; spike/ is research, not a release lane) and
      # pinned by hosted_pipeline_names_every_unrun_privileged_lane.
      - shell: bash
        run: |
          # Standalone assignment, not a substitution inside the heredoc: only
          # this form aborts under `set -e`. The tree hash is the wave's exit
          # anchor, so it must never silently render blank.
          TREE=$(git rev-parse 'HEAD^{tree}')
          cat >"$RUNNER_TEMP/lanes.txt" <<EOF
          commit $GITHUB_SHA tree $TREE
          scope: printed before any step runs, so it is scope, never a result — each step's own status is the evidence. This job attempts the cargo fmt/check/test/clippy gates, the diagnostic-object inventory test, every --self-test, and these lanes in full: scripts/verify-inspect-doctor.sh, scripts/verify-attach-e2e.sh, scripts/run-python-suites.py
          UNRUN: scripts/attach-pod.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/bench-overhead.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/build-release.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/capture-stopped-canary.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/check-canary-evidence.py (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/dump-owned-bpf-maps.py (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/k8s-profile-entry.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/qualify-inventory-c1b.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/qualify-task-storage-canary.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/run-t7-static-campaign.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/system-scope-measure.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/system-scope-owned.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/system-scope-receipt.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/system-scope-sample.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/system-scope-supervisor.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/task-1.6-lane-a.py (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/tsprobe.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/lane-build-release-oracle-1.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-6.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-7.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-8.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-10.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-11.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/lane-receipt-lane02-oracle-12.py (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/verify-canaries.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-capability-tier.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-discover-containers.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-induced-gaps.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/kind-e2e.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-live-discovery-preflight.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-receipt-lane02.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-receipt-lane16.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-abi-routing.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-fork-scope.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-ia32-compat.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-oracle.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-shared-layer.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-uretprobe-seccomp.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-docker.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-kind-pod.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-knative.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-pidns.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-proxy-stack.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          EOF
          cat "$RUNNER_TEMP/lanes.txt"
          { echo '## UNRUN lanes'; echo '```'; cat "$RUNNER_TEMP/lanes.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # UNRUN lanes end
      # The stable toolchain is single-sourced from .release-rust-version,
      # read inline like .coverage-floor; crate rust-version (MSRV) is unchanged.
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      # bpf-linker 0.10.4 (default feature rust-llvm-22) proxies to the LLVM bundled with the
      # toolchain that runs it (nightly); clang-18 compiles native CO-RE bitcode.
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 shellcheck softhsm2
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      # Network acquisition is explicit and precedes every offline validation.
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # The aya-p2 tree resolves its aya-obj dependency to the sibling p2
      # tree: its multi-backport needs fields only aya-obj-p2 has, so the
      # vendored upstream lock (crates.io aya-obj) cannot build it. Both
      # standalone steps inject that patch and resolve unlocked; the
      # shipped combination stays locked by the root workspace steps.
      # Resolving unlocked rewrites the tree's vendored Cargo.lock, which is
      # part of the recipe-pinned tree digest that the dependency check below
      # and every later scripts/cargo.sh preparation verify, so each unlocked
      # step restores the recipe's lock before it ends.
      - name: Fetch the standalone aya tree
        shell: bash
        run: |
          cp -p third-party/src/aya-0.14.0-p2/Cargo.lock "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock"
          cargo +"$(cat .release-rust-version)" fetch --config 'patch.crates-io.aya-obj.path="third-party/src/aya-obj-0.3.0-p2"' --manifest-path third-party/src/aya-0.14.0-p2/Cargo.toml
          cp -p "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock" third-party/src/aya-0.14.0-p2/Cargo.lock
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path third-party/src/aya-obj-0.3.0-p2/Cargo.toml
      - name: Verify prepared dependency selection
        shell: bash
        run: |
          . scripts/prepared-dependency-tools.sh
          p11scope_prepared_tools_select "$(command -v python3)" "$(command -v rustup)"
          RUSTC="$P11SCOPE_PREPARED_STABLE_RUSTC" \
            "$P11SCOPE_PREPARED_STABLE_CARGO" metadata --locked --offline --all-features --format-version 1 --manifest-path Cargo.toml >"$RUNNER_TEMP/root-metadata.json"
          RUSTC="$P11SCOPE_PREPARED_BPF_RUSTC" \
            "$P11SCOPE_PREPARED_BPF_CARGO" metadata --locked --offline --all-features --format-version 1 --manifest-path crates/ebpf/Cargo.toml >"$RUNNER_TEMP/bpf-metadata.json"
          "$P11SCOPE_PREPARED_PYTHON" -I scripts/check-prepared-dependencies.py \
            --sources third-party/sources.json \
            --metadata "Cargo.toml=$RUNNER_TEMP/root-metadata.json" \
            --metadata "crates/ebpf/Cargo.toml=$RUNNER_TEMP/bpf-metadata.json" --ledger
      - run: cargo +"$(cat .release-rust-version)" fmt --all -- --check
      - run: cargo +"$(cat .release-rust-version)" check --locked --offline --workspace --all-targets
      - run: cargo +"$(cat .release-rust-version)" test --locked --offline --workspace --all-targets
      - name: Aya dependency unit tests
        env:
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        shell: bash
        run: |
          cargo +"$(cat .release-rust-version)" test --offline --config 'patch.crates-io.aya-obj.path="third-party/src/aya-obj-0.3.0-p2"' --manifest-path third-party/src/aya-0.14.0-p2/Cargo.toml --target-dir target/aya-tests --lib
          cp -p "$RUNNER_TEMP/aya-0.14.0-p2.Cargo.lock" third-party/src/aya-0.14.0-p2/Cargo.lock
      - run: cargo +"$(cat .release-rust-version)" test --locked --offline --manifest-path third-party/src/aya-obj-0.3.0-p2/Cargo.toml --target-dir target/aya-obj-tests --lib
      - name: Prove the prepared dependency trees are unchanged
        run: python3 -I scripts/prepare-dependencies.py --check
      - run: cargo +"$(cat .release-rust-version)" clippy --locked --offline --workspace --all-targets -- -D warnings
      # The wide Detailed profile changes the embedded BPF object and the slot
      # bound; lint it so a default-only change cannot break the other profile.
      - run: cargo +"$(cat .release-rust-version)" clippy --locked --offline -p p11scope --all-targets --features wide-detailed-2112 -- -D warnings
      # libtest exits 0 when a filter matches nothing, so this step proves a test
      # actually ran rather than trusting the source to keep naming one. A rename,
      # an #[ignore], a #[cfg] that excludes it, or a deleted #[test] all empty the
      # filter identically, and all of them fail here.
      - shell: bash
        run: |
          cargo +"$(cat .release-rust-version)" test --locked --offline --features unsafe-unvalidated-metadata --test artifact_contracts -- --exact --nocapture frozen_policy_inventory_matches_embedded_object | tee "$RUNNER_TEMP/diagnostic-inventory.log"
          grep -q "^test result: ok. 1 passed" "$RUNNER_TEMP/diagnostic-inventory.log"
      - run: uname -r; cat /proc/sys/kernel/perf_event_paranoid; cat /proc/sys/kernel/yama/ptrace_scope
      # Unprivileged validator self-tests: every gate oracle, plus the frozen
      # evidence/object/receipt validators and the matrix oracles: every
      # self-test-capable script except scripts/gates.sh, the local entry point
      # that only invokes these (mechanical rule, pinned by
      # hosted_pipeline_runs_every_unprivileged_self_test). None needs sudo,
      # docker, cargo or bpftool. Two are not pure model checks:
      # verify-receipt-lane02.sh compiles spike/harness.c with gcc, reads it with
      # readelf, runs it under `timeout 5`, and needs a non-root caller (the
      # runner is one); qualify-inventory-native.sh compiles the ledgered
      # inventory workload and runs every mode against the softhsm2 package
      # installed above. The two container-less live lanes follow the block.
      - run: scripts/verify-inspect-doctor.sh --self-test
      - run: scripts/verify-attach-e2e.sh --self-test
      - run: scripts/verify-induced-gaps.sh --self-test
      - run: scripts/verify-discover-containers.sh --self-test
      - run: scripts/verify-capability-tier.sh --self-test
      - run: scripts/verify-live-discovery-preflight.sh --self-test
      - run: scripts/verify-canaries.sh --self-test
      - run: scripts/verify-provider-matrix.sh --self-test
      - run: scripts/release-gate.sh --self-test
      - run: scripts/verify-receipt-lane02.sh --self-test
      - run: scripts/verify-receipt-lane16.sh --self-test
      - run: scripts/attach-pod.sh --self-test
      - run: scripts/build-release.sh --self-test
      - run: scripts/bench-overhead.sh --self-test
      - run: scripts/bench-discovery.sh --self-test
      - run: scripts/k8s-profile-entry.sh --self-test
      - run: scripts/kind-e2e.sh --self-test
      - run: scripts/tsprobe.sh --self-test
      - run: scripts/qualify-inventory-native.sh --self-test
        timeout-minutes: 10
      - run: scripts/matrix/verify-fork-scope.sh --self-test
      - run: scripts/matrix/verify-ia32-compat.sh --self-test
      - run: scripts/matrix/verify-oracle.sh --self-test
      - run: scripts/matrix/verify-shared-layer.sh --self-test
      - run: scripts/matrix/verify-uretprobe-seccomp.sh --self-test
      - run: python3 -I scripts/check-bpf-map-defs.py --self-test
      - run: python3 -I scripts/check-canary-evidence.py --self-test
      - run: python3 -I scripts/check-capture-evidence.py --self-test
      - run: python3 -I scripts/check-live-discovery-object.py --self-test
      - run: python3 -I scripts/dump-owned-bpf-maps.py --self-test
      - run: python3 -I scripts/check-live-discovery-evidence.py --self-test
      - run: python3 -I scripts/lane-attach-e2e-oracle.py --self-test
      - run: python3 -I scripts/kind-e2e-oracle.py --self-test
      - run: python3 -I scripts/lane-inspect-doctor-oracle.py --self-test
      - run: python3 -I scripts/lane-induced-gaps-oracle-1.py --self-test
      - run: python3 -I scripts/lane-induced-gaps-oracle-2.py --self-test
      - run: python3 -I scripts/lane-induced-gaps-oracle-3.py --self-test
      - run: python3 -I scripts/lane-induced-gaps-oracle-4.py --self-test
      - run: python3 -I scripts/lane-bench-overhead-oracle-1.py --self-test
      - run: python3 -I scripts/lane-bench-overhead-oracle-3.py --self-test
      - run: python3 -I scripts/bench-discovery-stats.py --self-test
      - run: python3 -I scripts/task-1.6-lane-a.py --self-test
      - run: python3 -I scripts/task-1.6-lane-b-sparse-model.py --self-test
      - run: python3 -I scripts/inventory-native-oracle.py --self-test
      - run: scripts/verify-inspect-doctor.sh
      - run: scripts/verify-attach-e2e.sh
      # SYSPLAN residual gates. None names a lane body: the lint step
      # addresses directories through a shell variable, never a scripts/
      # path (the pipeline derivation test forbids lane paths here).
      # Every tests/python suite (F-62): the runner checks that each file is
      # registered exactly once (run here, driven by a named cargo test or
      # self-test, or excluded with a reason), fails on any unregistered or
      # vanished suite, and runs the standalone ones, including help-drift
      # (test_help_usage_drift.py), schema, release-notice, packaging and
      # residual-gate suites. `--list` prints the registry.
      - name: tests/python suites (help-drift, schema, residual gates, every standalone suite)
        run: python3 -I scripts/run-python-suites.py
      - run: cargo +"$(cat .release-rust-version)" install cargo-audit --version 0.22.2 --locked
      - run: cargo +"$(cat .release-rust-version)" install cargo-deny --version 0.20.2 --locked
      - run: cargo +"$(cat .release-rust-version)" audit
      # The host and BPF crates have separate Cargo roots and license policies.
      # The BPF-only GPL-2.0-only allowance must not leak into the host graph.
      - run: cargo +"$(cat .release-rust-version)" deny --locked check
      - run: cargo +"$(cat .release-rust-version)" deny --locked --manifest-path crates/ebpf/Cargo.toml --config deny-ebpf.toml check
      - run: pipx install ruff==0.16.8
      - name: lint shell scripts (error level)
        shell: bash
        run: |
          for dir in scripts scripts/matrix; do
            shellcheck -S error "$dir"/*.sh
          done
      - run: ruff check scripts/ tests/python/
  # MSRV floor: 1.88 stays the minimum supported compiler while the release
  # compiler moves on. The literal 1.88 pins below are intentional — the one
  # exemption to the .release-rust-version single-source rule, scoped by
  # release_compiler_contracts::ci_msrv_exemption_is_scoped.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.88 --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: cargo +1.88 install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib libseccomp-dev llvm python3
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +1.88 fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - run: cargo +1.88 fmt --all -- --check
      - run: cargo +1.88 check --locked --offline --workspace --all-targets
      - run: cargo +1.88 test --locked --offline --workspace --all-targets
      - run: cargo +1.88 clippy --locked --offline --workspace --all-targets -- -D warnings
  # A step cannot read its own job's log, so a second job fetches the finished
  # log through the Actions API and keeps it as a run artifact (90 days requested;
  # repo and org settings can cap that). Its
  # token gets actions: read and nothing else; upload-artifact uses the runtime
  # token, not GITHUB_TOKEN. No cache anywhere.
  archive-log:
    needs: checks-and-e2e
    # Not always(): a cancelled run's log is truncated by definition, and
    # publishing it produces an artifact that looks like evidence of a
    # completed job and is not. Failures still archive.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          JOB_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "checks-and-e2e") | .id')
          test -n "$JOB_ID"
          # .../jobs/<id>/logs answers 302 to blob storage and gh api follows it: a 302 in a
          # verbose trace is the success path, not a failure. It can also 404 for a short
          # window right after the job completes, while the log is finalized, hence the
          # bounded retry: 3 attempts, 5s apart, fail after the third. That window
          # also answers 200 with an empty body, so an attempt counts as success
          # only when it produced a non-empty log; otherwise a green archive job
          # would upload a 0-byte artifact and claim the log was retained.
          for attempt in 1 2 3; do
            # A job log is full of ANSI colour; without this gh refuses to emit it
            # and writes nothing, which the emptiness check below then fails on.
            if gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$RUNNER_TEMP/checks-and-e2e.log" \
              && [ -s "$RUNNER_TEMP/checks-and-e2e.log" ]; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "job $JOB_ID log fetch produced no content after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          # Not just informational: the loop exits on a hardcoded attempt number,
          # so shortening the list would fall through with the empty file `gh api`
          # created. A simple command, NOT an `&&` list -- an `&&` list is exempt
          # from errexit, so anywhere but the final line it would be inert.
          test -s "$RUNNER_TEMP/checks-and-e2e.log"
          wc -c "$RUNNER_TEMP/checks-and-e2e.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-and-e2e-log
          path: ${{ runner.temp }}/checks-and-e2e.log
          if-no-files-found: error
          retention-days: 90
  # SYSPLAN residual F-04: one privileged CI E2E job running the gated
  # system-scope cells (pid/system x metrics/profile) with their
  # expected-count oracles. Required-but-manual: it runs only on manual
  # dispatch, on a self-hosted BPF-capable runner. On push/PR it skips
  # without implying anything ran; while no runner carries these labels
  # the job waits rather than going green. Real and runnable: dispatch it
  # from the Actions tab once a [self-hosted, bpf] runner exists.
  privileged-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.privileged_e2e }}
    runs-on: [self-hosted, bpf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 softhsm2
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      # The four gated cells in one lane invocation: --scope both runs
      # pid+system, --mode both runs metrics+profile, and the lane's own
      # oracle joins observer report + traces + workload TRUTH per cell.
      - run: scripts/system-scope-measure.sh --scope both --mode both
  # SYSPLAN residual F-28: release preview (musl build, docker build/lint,
  # kubeconform, SBOM, build-release.sh wired). Manual like the privileged
  # lane: dispatch it on demand; it never blocks PRs and never implies a
  # release ran. Hosted runners suffice (passwordless sudo covers the
  # receipt steps); no special labels needed.
  release-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_preview }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: rustup target add --toolchain "$(cat .release-rust-version)" x86_64-unknown-linux-musl
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm musl-tools python3 softhsm2
      # Azure kernel tools omit bpftool. Select the generic package's real
      # executable instead of the common wrapper that dispatches by uname.
      - name: Install packaged bpftool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y linux-tools-generic
          tools_package=$(dpkg-query -W -f='${Depends}' linux-tools-generic)
          [[ "$tools_package" =~ ^linux-tools-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$ ]]
          bpftool_source="/usr/lib/linux-tools/${tools_package#linux-tools-}/bpftool"
          test -x "$bpftool_source"
          sudo install -m 0755 "$bpftool_source" /usr/local/bin/bpftool
          bpftool version
          sudo bpftool version
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - run: cargo +"$(cat .release-rust-version)" build --locked --offline --release --target x86_64-unknown-linux-musl
      - run: docker build -f deploy/Dockerfile.observer -t p11scope-observer:preview .
      - run: docker build -f deploy/Dockerfile.holder -t p11scope-holder:preview .
      - name: Download verified release tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/release-tools"
          mkdir -m 700 "$tools"
          curl -fsSL --retry 3 -o "$tools/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.13.1/hadolint-linux-x86_64
          echo "f8b05e4c724cdeb84c0dca07e40936c3d875c0af5d120a27c94026a0f370b2cf  $tools/hadolint" | sha256sum --check
          chmod 755 "$tools/hadolint"
          curl -fsSL --retry 3 -o "$tools/cargo-about.tar.gz" \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $tools/cargo-about.tar.gz" | sha256sum --check
          tar -xzf "$tools/cargo-about.tar.gz" -C "$tools" \
            cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
          install -m 0755 "$tools/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" "$tools/cargo-about"
          curl -fsSL --retry 3 -o "$tools/musl-1.2.3.tar.gz" \
            https://musl.libc.org/releases/musl-1.2.3.tar.gz
          echo "7d5b0b6062521e4627e099e4c9dc8248d32a30285e959b7eecaa780cf8cfd4a4  $tools/musl-1.2.3.tar.gz" | sha256sum --check
          curl -fsSL --retry 3 -o "$tools/musl-1.2.5.tar.gz" \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz
          echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  $tools/musl-1.2.5.tar.gz" | sha256sum --check
          curl -fsSL --retry 3 -o "$tools/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $tools/kubeconform.tar.gz" | sha256sum --check
          tar -xzf "$tools/kubeconform.tar.gz" -C "$tools" kubeconform
          chmod 755 "$tools/kubeconform"
      - run: '"$RUNNER_TEMP/release-tools/hadolint" deploy/Dockerfile.observer'
      - run: '"$RUNNER_TEMP/release-tools/hadolint" deploy/Dockerfile.holder'
      # The full receipt, logs and capture stay in ephemeral runner storage.
      # Only selected public outputs below are uploaded as artifacts.
      - run: mkdir -m 700 "$RUNNER_TEMP/release-evidence"
      - run: TMPDIR="$RUNNER_TEMP/release-evidence" scripts/build-release.sh "$RUNNER_TEMP/release-evidence/receipt"
      - name: Release receipt summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 -I - "$RUNNER_TEMP/release-evidence/receipt" "$GITHUB_STEP_SUMMARY" <<'PY'
          from pathlib import Path
          import re
          import sys

          # Publish only fixed IDs and constrained error codes, never raw logs.
          import json

          STAGES = {
              "=== release privacy gate ===": "privacy-gate",
              "=== p11scope: dynamic-build attach correctness ===": "dynamic-attach",
              "=== p11scope: isolated safe-only official static build ===": "static-build",
              "=== p11scope-discover: dynamic glibc + dynamic musl builds ===": "discover-containers",
              "--- smoke run: p11scope-discover (glibc), on host ---": "discover-host-smoke",
              "=== packaged discovery helper smoke ===": "packaged-helper-smoke",
              "=== p11scope: smoke run of the packaged STATIC artifact itself ===": "static-help-smoke",
              "=== official static hostile-target smoke ===": "static-hostile-smoke",
              "=== build-release: ALL OK ===": "body-complete",
          }
          SUBSTAGES = {
              "=== build ===": "build",
              "=== discover deterministic matrix providers ===": "canary-provider-discovery",
              "=== default-safe-profile (default profile) ===": "canary-default-safe-profile",
              "=== default-safe-trace (default trace) ===": "canary-default-safe-trace",
              "=== feature-safe-profile (feature profile) ===": "canary-feature-safe-profile",
              "=== feature-safe-trace (feature trace) ===": "canary-feature-safe-trace",
              "=== feature-unsafe-profile (feature-unsafe profile) ===": "canary-feature-unsafe-profile",
              "=== feature-unsafe-trace (feature-unsafe trace) ===": "canary-feature-unsafe-trace",
              "=== aggregate-only-metrics (default metrics) ===": "canary-aggregate-only-metrics",
              "=== live safe START policy: hostile exact-name and mechanism controls ===": "canary-safe-start",
              "=== live diagnostic START policy: distinct template faults ===": "canary-diagnostic-start",
              "=== owned-default-metrics (default owned metrics) ===": "canary-owned-default-metrics",
              "=== owned-feature-metrics (feature owned metrics) ===": "canary-owned-feature-metrics",
              "=== isolated seeded task-storage byte controls ===": "canary-task-storage",
              "=== assert capture-policy matrix ===": "canary-matrix-check",
              "=== softhsm token ===": "attach-token-setup",
              "=== observe (manifest-free: memory scan only) ===": "attach-scan",
              "=== observe (manifest corroborated against the scan) ===": "attach-manifest",
          }
          SIGNATURES = {
              "observer-readiness-custody-error": r"^capture-stopped-canary: observer-readiness: CustodyError$",
              "apt-dns-resolution": r"^W: Failed to fetch https?://\S+\s+Temporary failure resolving '[^']+'$",
              "apt-no-installation-candidate": r"^E: Package '[^']+' has no installation candidate$",
              "process-terminated": r"^Terminated$",
              "process-killed": r"^Killed$",
              "finalizer-artifact-ledger-unrecorded": r"^release artifact ledger was not recorded$",
              "cargo-compilation-failed": r"^error: could not compile ",
              "cargo-build-script-failed": r"^error: failed to run custom build command for ",
              "python-assertion-failed": r"^AssertionError(?::|$)",
              "capture-evidence-rejected": r"^capture evidence rejected:",
              "canary-workload-identity-unavailable": r"^[a-z-]+ workload identity unavailable$",
              "canary-workload-exited-before-ready": r"^[a-z-]+ workload exited before complete READY$",
              "canary-workload-ready-missing": r"^[a-z-]+ workload never published complete READY$",
              "canary-workload-exited-before-oracle": r"^[a-z-]+ workload exited before START oracle completed$",
              "canary-workload-termination-failed": r"^[a-z-]+ workload could not be terminated$",
              "canary-workload-exit-mismatch": r"^[a-z-]+ workload exit status [0-9]{1,3}, expected SIGTERM status 143$",
          }
          PYTHON_SCRIPTS = {
              "capture-stopped-canary.py", "check-canary-evidence.py",
              "check-capture-evidence.py", "canary_process_custody.py",
              "dump-owned-bpf-maps.py", "qualify-task-storage-canary.py",
          }
          COUNTERS = {
              "event_loss", "start_insert_failures", "unmatched_returns", "rv_update_failures",
              "cgroup_scope_failures", "abi_refusals", "semantic_capture_failures",
              "unregistered_mechanisms", "template_tail_failures", "process_tracking_fallbacks",
              "process_tracking_failures", "process_tracking_evictions", "state_reconciliations",
              "session_cancel_ambiguities", "session_cancel_unknown_flags", "operation_state_imports",
              "auth_state_ambiguities", "async_target_failures", "async_orphans", "async_duplicates",
              "async_evictions", "fork_state_ambiguities", "semantic_state_drops", "semantic_history_drops",
              "pending_at_end", "malformed_records", "orphan_ops", "unmatched_closes",
              "shape_decode_failures", "shape_decode_total_failures", "discovery_conflicts",
              "discovery_uncorroborated", "module_ambiguous", "discovery_ring_loss",
              "discovery_state_failures", "discovery_read_failures", "discovery_truncated",
              "task_uprobe_link_losses",
          }
          ERRNOS = {
              "EPERM": (1, "Operation not permitted"),
              "ENOENT": (2, "No such file or directory"),
              "ENOMEM": (12, "Cannot allocate memory"),
              "EACCES": (13, "Permission denied"),
              "EINVAL": (22, "Invalid argument"),
              "ENOSPC": (28, "No space left on device"),
              "EOPNOTSUPP": (95, "Operation not supported"),
              "ETIMEDOUT": (110, "Connection timed out"),
              "EDQUOT": (122, "Disk quota exceeded"),
          }

          def diagnostics(receipt):
              stage, substage = "unknown", "unknown"
              signals, rustc_codes, errnos = set(), set(), set()
              locations = set()
              counter_mismatches = set()
              stderr_state = "missing"
              for filename in ("stdout.log", "stderr.log"):
                  path = receipt / filename
                  if not path.is_file():
                      continue
                  nonempty, matched = False, False
                  with path.open(encoding="utf-8", errors="replace") as stream:
                      for raw in stream:
                          line = raw.rstrip("\r\n")
                          nonempty |= bool(line.strip())
                          if filename == "stdout.log":
                              if line in STAGES:
                                  stage, substage = STAGES[line], "unknown"
                              elif line in SUBSTAGES:
                                  substage = SUBSTAGES[line]
                          for label, pattern in SIGNATURES.items():
                              if re.search(pattern, line):
                                  signals.add(label); matched = True
                          counter = re.fullmatch(r"capture evidence rejected: ([a-z_]+): want (0|[1-9][0-9]{0,19}), got (0|[1-9][0-9]{0,19})", line)
                          if counter and counter[1] in COUNTERS and len(counter_mismatches) < 64:
                              expected, observed = int(counter[2]), int(counter[3])
                              if expected < 2**64 and observed < 2**64:
                                  counter_mismatches.add((counter[1], expected, observed))
                                  matched = True
                          location = re.fullmatch(r'  File "([^"\n]+)", line ([1-9][0-9]{0,5}), in [A-Za-z_][A-Za-z_0-9]*', line)
                          if not location:
                              location = re.fullmatch(r'canary-failure-location: ([A-Za-z_][A-Za-z_0-9.-]*):([1-9][0-9]{0,5})', line)
                          if location and len(locations) < 64:
                              script = Path(location[1]).name
                              if script in PYTHON_SCRIPTS:
                                  locations.add((script, int(location[2])))
                                  matched = True
                          for code in re.findall(r"\berror\[(E[0-9]{4})\]:", line):
                              rustc_codes.add(code); matched = True
                          for name, (number, message) in ERRNOS.items():
                              pattern = rf"\b{name}\b|\bos error {number}\b|{re.escape(message)}"
                              if re.search(pattern, line):
                                  errnos.add(name); matched = True
                  if filename == "stderr.log":
                      stderr_state = "matched-signature" if matched else ("unknown" if nonempty else "empty")
              return dict(last_recorded_stage=stage, last_recorded_substage=substage,
                          observed_signature_ids=sorted(signals), rustc_error_codes=sorted(rustc_codes),
                          python_failure_locations=[dict(script=script, line=line) for script, line in sorted(locations)],
                          counter_mismatches=[dict(counter=name, expected=expected, observed=observed)
                                              for name, expected, observed in sorted(counter_mismatches)],
                          observed_errno_names=sorted(errnos), stderr_classification=stderr_state)

          receipt, summary = map(Path, sys.argv[1:])
          keys = ("head", "tree", "checker_status", "terminal_status",
                  "release_artifacts_sha256")
          facts = {}
          path = receipt / "facts.log"
          if path.is_file():
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  key, sep, value = line.partition("\t")
                  if sep and key in keys:
                      facts[key] = value if key not in facts else ""
          status_file = receipt / "status"
          status = status_file.read_text(encoding="ascii", errors="replace").strip() \
              if status_file.is_file() else ""
          facts = {"status": status, **facts}
          with summary.open("a", encoding="utf-8") as output:
              output.write("## Release receipt summary\n\n")
              for key in ("status", *keys):
                  pattern = r"[0-9]+" if key.endswith("status") else \
                      (r"[0-9a-f]{40}" if key in ("head", "tree") else r"[0-9a-f]{64}")
                  value = facts.get(key, "")
                  valid = bool(re.fullmatch(pattern, value))
                  if valid and key.endswith("status"):
                      valid = int(value) <= 255
                  output.write(f"- {key}: `{value if valid else 'unavailable'}`\n")
          report = diagnostics(receipt)
          print("release-diagnostic: " + json.dumps(report, sort_keys=True))
          with summary.open("a", encoding="utf-8") as output:
              output.write("\n## Release diagnostic summary\n\n```json\n")
              output.write(json.dumps(report, sort_keys=True, indent=2) + "\n```\n")
          PY
      # Assemble public assets from the verified receipt, source and notices.
      - name: Assemble public release candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/export-source.py \
            --output "$RUNNER_TEMP/release-evidence/p11scope-0.1.0-source.tar.gz"
          python3 -I scripts/release-notices.py \
            --cargo-about "$RUNNER_TEMP/release-tools/cargo-about" \
            --musl-archive "$RUNNER_TEMP/release-tools/musl-1.2.3.tar.gz" \
            --musl-archive "$RUNNER_TEMP/release-tools/musl-1.2.5.tar.gz" \
            --output "$RUNNER_TEMP/release-evidence/notices"
          python3 -I scripts/package-release.py \
            --receipt "$RUNNER_TEMP/release-evidence/receipt" \
            --notices "$RUNNER_TEMP/release-evidence/notices" \
            --source "$RUNNER_TEMP/release-evidence/p11scope-0.1.0-source.tar.gz" \
            --output "$RUNNER_TEMP/release-evidence/public"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview-public-assets
          path: ${{ runner.temp }}/release-evidence/public/
          if-no-files-found: error
          retention-days: 30
      # This SBOM describes the preview container image, not the official
      # receipt-built observer executable or the public binary assets.
      - uses: anchore/sbom-action@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          image: p11scope-observer:preview
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-observer-container-preview.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-observer-container-preview
          path: ${{ runner.temp }}/sbom-observer-container-preview.spdx.json
          if-no-files-found: error
          retention-days: 30
      - run: '"$RUNNER_TEMP/release-tools/kubeconform" -summary deploy/k8s/'
  # SYSPLAN residual F-40: coverage gate with a ratchet. The floor lives in
  # .coverage-floor (raise it, never lower it); the job fails the workflow
  # when workspace line coverage drops below it. Include the existing CLI and
  # integration tests so their exercised production paths count toward the gate.
  coverage:
    runs-on: ubuntu-24.04
    env:
      # Full DWARF plus coverage makes the self-inspecting test executable
      # exceed the scanner's 256 MiB object limit. Keep line information
      # and coverage instrumentation without the full type/variable data.
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version 0.10.4 --locked
      - run: cargo +"$(cat .release-rust-version)" install cargo-llvm-cov --version 0.9.1 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 softhsm2
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - run: cargo +"$(cat .release-rust-version)" llvm-cov --locked --offline --workspace --all-targets --fail-under-lines "$(cat .coverage-floor)"
  # SYSPLAN residual F-29: flake quarantine. Failure-gated triage evidence:
  # when checks fail, each ledgered flake re-runs exactly once, serially,
  # in isolation. A green quarantine run never greens the workflow.
  quarantine:
    needs: checks-and-e2e
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 gcc gcc-multilib jq libseccomp-dev llvm python3 softhsm2
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - run: scripts/run-flake-quarantine.sh
        env:
          TMPDIR: ${{ runner.temp }}
