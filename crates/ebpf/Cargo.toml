[package]
name = "p11scope-ebpf"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[features]
wide-detailed-2112 = ["p11scope-ebpf-common/wide-detailed-2112"]
inventory-only = []
inventory-callers = ["inventory-only"]
small-ring = ["p11scope-ebpf-common/small-ring"]
small-state-maps = ["p11scope-ebpf-common/small-state-maps"]
small-discovery-ring = ["p11scope-ebpf-common/small-discovery-ring"]
unsafe-unvalidated-metadata = []

[dependencies]
aya-ebpf = "=0.2.1"
p11scope-ebpf-common = { version = "0.0.0", path = "../ebpf-common" }

[[bin]]
name = "p11scope-ebpf"
path = "src/main.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace]
