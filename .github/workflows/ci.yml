name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks-and-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # UNRUN lanes begin
      # Honest scope, printed first so it reaches the log even when a later step
      # fails. A passing --self-test exercises a lane's oracle model, never the
      # lane; a green job never implies these lanes ran. The list is derived
      # (every privileged script under scripts/, minus the ones this job runs
      # in full; spike/ is research, not a release lane) and
      # pinned by hosted_pipeline_names_every_unrun_privileged_lane.
      - shell: bash
        run: |
          # Standalone assignment, not a substitution inside the heredoc: only
          # this form aborts under `set -e`. The tree hash is the wave's exit
          # anchor, so it must never silently render blank.
          TREE=$(git rev-parse 'HEAD^{tree}')
          cat >"$RUNNER_TEMP/lanes.txt" <<EOF
          commit $GITHUB_SHA tree $TREE
          scope: printed before any step runs, so it is scope, never a result — each step's own status is the evidence. This job attempts the cargo fmt/check/test/clippy gates, the diagnostic-object inventory test, every --self-test, and these lanes in full: scripts/verify-inspect-doctor.sh, scripts/verify-attach-e2e.sh
          UNRUN: scripts/attach-pod.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/bench-overhead.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/build-release.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/dump-owned-bpf-maps.py (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-canaries.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-capability-tier.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-discover-containers.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-induced-gaps.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-live-discovery-preflight.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-task4-lane02.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/verify-task4-lane16.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-fork-scope.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-oracle.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-shared-layer.sh (privileged/container lane body UNRUN hosted; only its unprivileged self-test runs in this job; local run needs owner approval)
          UNRUN: scripts/matrix/verify-docker.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-kind-pod.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-knative.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          UNRUN: scripts/matrix/verify-proxy-stack.sh (privileged/container lane body UNRUN hosted; no self-test; local run needs owner approval)
          EOF
          cat "$RUNNER_TEMP/lanes.txt"
          { echo '## UNRUN lanes'; echo '```'; cat "$RUNNER_TEMP/lanes.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # UNRUN lanes end
      - run: rustup toolchain install 1.88 --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      # bpf-linker 0.10.4 (default feature rust-llvm-22) proxies to the LLVM bundled with the
      # toolchain that runs it (nightly); no system LLVM is needed at build time.
      - run: cargo +1.88 install bpf-linker --version 0.10.4 --locked
      - run: sudo apt-get update && sudo apt-get install -y gcc jq llvm python3 softhsm2
      - run: cargo +1.88 fmt --all -- --check
      - run: cargo +1.88 check --locked --workspace --all-targets
      - run: cargo +1.88 test --locked --workspace --all-targets
      - run: cargo +1.88 clippy --locked --workspace --all-targets -- -D warnings
      # libtest exits 0 when a filter matches nothing, so this step proves a test
      # actually ran rather than trusting the source to keep naming one. A rename,
      # an #[ignore], a #[cfg] that excludes it, or a deleted #[test] all empty the
      # filter identically, and all of them fail here.
      - shell: bash
        run: |
          cargo +1.88 test --locked --features unsafe-unvalidated-metadata --test artifact_contracts -- --exact --nocapture frozen_policy_inventory_matches_embedded_object | tee "$RUNNER_TEMP/diagnostic-inventory.log"
          grep -q "^test result: ok. 1 passed" "$RUNNER_TEMP/diagnostic-inventory.log"
      - run: uname -r; cat /proc/sys/kernel/perf_event_paranoid; cat /proc/sys/kernel/yama/ptrace_scope
      # Unprivileged validator self-tests: every gate oracle, plus the frozen
      # evidence/object/receipt validators and the matrix oracles: every
      # self-test-capable script except scripts/gates.sh, the local entry point
      # that only invokes these (mechanical rule, pinned by
      # hosted_pipeline_runs_every_unprivileged_self_test). None needs sudo,
      # docker, cargo or bpftool. verify-task4-lane02.sh is the one that is not
      # a pure model check: it compiles spike/harness.c with gcc, reads it with
      # readelf, runs it under `timeout 5`, and needs a non-root caller (the
      # runner is one). The two container-less live lanes follow the block.
      - run: scripts/verify-inspect-doctor.sh --self-test
      - run: scripts/verify-attach-e2e.sh --self-test
      - run: scripts/verify-induced-gaps.sh --self-test
      - run: scripts/verify-discover-containers.sh --self-test
      - run: scripts/verify-capability-tier.sh --self-test
      - run: scripts/verify-live-discovery-preflight.sh --self-test
      - run: scripts/verify-canaries.sh --self-test
      - run: scripts/verify-task4-lane02.sh --self-test
      - run: scripts/verify-task4-lane16.sh --self-test
      - run: scripts/attach-pod.sh --self-test
      - run: scripts/build-release.sh --self-test
      - run: scripts/matrix/verify-fork-scope.sh --self-test
      - run: scripts/matrix/verify-oracle.sh --self-test
      - run: scripts/matrix/verify-shared-layer.sh --self-test
      - run: python3 -I scripts/check-bpf-map-defs.py --self-test
      - run: python3 -I scripts/check-capture-evidence.py --self-test
      - run: python3 -I scripts/check-live-discovery-object.py --self-test
      - run: python3 -I scripts/dump-owned-bpf-maps.py --self-test
      - run: python3 -I scripts/check-live-discovery-evidence.py --self-test
      - run: scripts/verify-inspect-doctor.sh
      - run: scripts/verify-attach-e2e.sh
  # A step cannot read its own job's log, so a second job fetches the finished
  # log through the Actions API and keeps it as a run artifact (90 days requested;
  # repo and org settings can cap that). Its
  # token gets actions: read and nothing else; upload-artifact uses the runtime
  # token, not GITHUB_TOKEN. No cache anywhere.
  archive-log:
    needs: checks-and-e2e
    # Not always(): a cancelled run's log is truncated by definition, and
    # publishing it produces an artifact that looks like evidence of a
    # completed job and is not. Failures still archive.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          JOB_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "checks-and-e2e") | .id')
          test -n "$JOB_ID"
          # .../jobs/<id>/logs answers 302 to blob storage and gh api follows it: a 302 in a
          # verbose trace is the success path, not a failure. It can also 404 for a short
          # window right after the job completes, while the log is finalized, hence the
          # bounded retry: 3 attempts, 5s apart, fail after the third. That window
          # also answers 200 with an empty body, so an attempt counts as success
          # only when it produced a non-empty log; otherwise a green archive job
          # would upload a 0-byte artifact and claim the log was retained.
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$RUNNER_TEMP/checks-and-e2e.log" \
              && [ -s "$RUNNER_TEMP/checks-and-e2e.log" ]; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "job $JOB_ID log fetch produced no content after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          # Not just informational: the loop exits on a hardcoded attempt number,
          # so shortening the list would fall through with the empty file `gh api`
          # created. This is what actually refuses a 0-byte upload.
          [ -s "$RUNNER_TEMP/checks-and-e2e.log" ] && wc -c "$RUNNER_TEMP/checks-and-e2e.log"
      - uses: actions/upload-artifact@v4
        with:
          name: checks-and-e2e-log
          path: ${{ runner.temp }}/checks-and-e2e.log
          if-no-files-found: error
          retention-days: 90
