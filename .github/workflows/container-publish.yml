name: container-publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
env:
  CI_TOOL_BPF_LINKER: 0.10.4
jobs:
  # Rebuild the observer image from the tag bytes: the FULL musl binary is
  # built from this commit with the pinned release toolchain (the same recipe
  # the privileged container-image cell qualifies), staged with the entry
  # script and license texts, and built with --network=none after pulling the
  # Dockerfile-pinned base by digest. The smoke runs the image with the
  # documented minimal flags (--version, doctor, a short inventory --system
  # with SoftHSM on the runner). Nothing here pushes: the push job owns the
  # registry write, final-tag-gated. Every v* tag of this repository builds
  # and smokes, so release candidates validate without publishing.
  build:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mingulov/p11scope' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "$(cat .release-rust-version)" --profile minimal --component rustfmt,clippy
      - run: rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - run: rustup target add --toolchain "$(cat .release-rust-version)" x86_64-unknown-linux-musl
      - run: cargo +"$(cat .release-rust-version)" install bpf-linker --version "$CI_TOOL_BPF_LINKER" --locked
      - run: sudo apt-get update && sudo apt-get install -y clang-18 file gcc jq llvm musl-tools python3 softhsm2
      - name: Reconstruct pinned dependency sources
        run: python3 -I scripts/prepare-dependencies.py
      - run: cargo +"$(cat .release-rust-version)" fetch --locked --manifest-path Cargo.toml
      - run: cargo +nightly-2026-05-20 fetch --locked --manifest-path crates/ebpf/Cargo.toml
      - name: Prove the default build environment
        shell: bash
        run: |
          if env | grep -E '^(P11SCOPE_SMALL_|P11SCOPE_JOURNAL=|P11SCOPE_JOURNAL_PROOF=|P11SCOPE_BIRTH_MARKER=|RUSTFLAGS=|CARGO_ENCODED_RUSTFLAGS=)'; then
            echo "refusing: size-override or flavor environment is set" >&2
            exit 1
          fi
      - name: Build the FULL musl observer from the tag bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo +"$(cat .release-rust-version)" build --locked --offline --release \
            --target x86_64-unknown-linux-musl --bin p11scope
          bin=target/x86_64-unknown-linux-musl/release/p11scope
          test -f "$bin" && test -x "$bin" && test ! -L "$bin"
          file -b "$bin" | grep -q "static-pie linked"
          sha256sum "$bin" | tee "$RUNNER_TEMP/built-observer.sha256"
          ctx="$RUNNER_TEMP/container-publish-ctx"
          mkdir -p "$ctx/target/x86_64-unknown-linux-musl/release" "$ctx/scripts"
          cp "$bin" "$ctx/target/x86_64-unknown-linux-musl/release/p11scope"
          cp "$GITHUB_WORKSPACE/scripts/k8s-profile-entry.sh" "$ctx/scripts/"
          cp "$GITHUB_WORKSPACE/LICENSE" "$ctx/"
          cp -r "$GITHUB_WORKSPACE/LICENSES" "$ctx/"
      - name: Build the observer image with no network
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          base=$(sed -n 's/^FROM //p' deploy/Dockerfile.observer)
          test -n "$base"
          test "$(printf '%s\n' "$base" | wc -l)" -eq 1
          case "$base" in *@sha256:*) ;; *) echo "base is not digest-pinned: $base" >&2; exit 1 ;; esac
          docker pull "$base"
          docker build --network=none -f deploy/Dockerfile.observer \
            -t p11scope-observer:preview "$RUNNER_TEMP/container-publish-ctx"
          docker inspect --format '{{.Id}}' p11scope-observer:preview \
            | tee "$RUNNER_TEMP/image-id.txt"
          grep -Eq '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/image-id.txt"
      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          export SOFTHSM2_CONF="$RUNNER_TEMP/container-publish-softhsm2.conf"
          mkdir -m 700 "$RUNNER_TEMP/container-publish-tokens"
          printf 'directories.tokendir = %s/container-publish-tokens\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP" >"$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label smoke --so-pin 5678 --pin 1234
          docker run --rm p11scope-observer:preview --version
          flags=(--pid=host --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add DAC_READ_SEARCH)
          if [ -r /sys/module/apparmor/parameters/enabled ] \
            && grep -q Y /sys/module/apparmor/parameters/enabled 2>/dev/null; then
            flags+=(--security-opt apparmor=unconfined)
          fi
          flags+=(-v /sys/fs/cgroup:/sys/fs/cgroup:ro)
          set +e
          docker run --rm "${flags[@]}" p11scope-observer:preview doctor >smoke-doctor.txt 2>&1
          code=$?
          set -e
          cat smoke-doctor.txt
          test "$code" -eq 0 -o "$code" -eq 1
          grep -q '^Doctor:' smoke-doctor.txt
          docker run --rm "${flags[@]}" p11scope-observer:preview \
            inventory --system --duration 15 --json >smoke-inventory.json 2>smoke-inventory.err
          echo "inventory exit=$?"
          python3 -I - smoke-inventory.json smoke-inventory.err <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          document = json.loads(Path(sys.argv[1]).read_text())
          assert document.get("schema") == "p11scope/inventory/v1", "inventory schema"
          scanned = [int(value) for value in re.findall(r"([0-9]+) scanned", Path(sys.argv[2]).read_text())]
          assert scanned and max(scanned) > 0, "the smoke must scan host processes"
          print(f"smoke ok: schema p11scope/inventory/v1, scanned {max(scanned)}")
          PY
      - name: Save the image for the push job
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          out="$RUNNER_TEMP/container-publish-out"
          mkdir -p "$out"
          docker save p11scope-observer:preview -o "$out/observer.tar"
          cp "$RUNNER_TEMP/image-id.txt" "$out/image-id.txt"
          cp "$RUNNER_TEMP/built-observer.sha256" "$out/built-observer.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-publish-tarball
          path: ${{ runner.temp }}/container-publish-out/
          if-no-files-found: error
          retention-days: 30
  # The only registry write: the exact tarball bytes the build job saved,
  # re-identified by image ID after loading, published to
  # ghcr.io/mingulov/p11scope only when this run was triggered on a final
  # release tag (vX.Y.Z, this repository). Prerelease tags (vX.Y.Z-...)
  # build and smoke but skip the push; any other v* tag fails closed.
  # packages: write is scoped to this job; the top level stays read-only.
  push:
    needs: build
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'mingulov/p11scope' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-publish-tarball
          path: ./publish-in
      - name: Push the exact built image on the release tag
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          cd publish-in
          test -f observer.tar && test -f image-id.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' image-id.txt
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final release tag $GITHUB_REF_NAME: publishing"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "prerelease tag $GITHUB_REF_NAME: build and smoke only, not publishing"
            {
              echo "image: (not published: prerelease $GITHUB_REF_NAME)"
              echo "source: $GITHUB_SHA"
            } | tee receipt.txt
            {
              echo "## container-publish"
              echo ""
              echo "prerelease \`$GITHUB_REF_NAME\` from \`$GITHUB_SHA\`: validated, not published."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "refusing: tag $GITHUB_REF_NAME is not a version tag" >&2
            exit 1
          fi
          docker load -i observer.tar
          loaded=$(docker inspect --format '{{.Id}}' p11scope-observer:preview)
          test "$loaded" = "$(cat image-id.txt)"
          tag="${GITHUB_REF_NAME#v}"
          version_dest="ghcr.io/mingulov/p11scope:$tag"
          latest_dest="ghcr.io/mingulov/p11scope:latest"
          docker tag p11scope-observer:preview "$version_dest"
          docker tag p11scope-observer:preview "$latest_dest"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$version_dest" | tee push-version.log
          docker push "$latest_dest" | tee push-latest.log
          version_digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push-version.log | tail -1)
          latest_digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push-latest.log | tail -1)
          test -n "$version_digest"
          test "$version_digest" = "$latest_digest"
          {
            echo "image: $version_dest"
            echo "image: $latest_dest"
            echo "digest: $version_digest"
            echo "source: $GITHUB_SHA"
          } | tee receipt.txt
          {
            echo "## container-publish"
            echo ""
            echo "published \`$version_dest\` and \`$latest_dest\` \`$version_digest\` from \`$GITHUB_SHA\`."
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-publish-receipt
          path: ./publish-in/receipt.txt
          if-no-files-found: error
          retention-days: 30
