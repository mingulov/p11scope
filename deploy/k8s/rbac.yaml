# Least-privilege API access for the node observer: read-only pod metadata so
# a target pod resolves to its container id without copying anything in or
# out. The observer reads target memory via hostPID + /proc and the pod
# cgroup via the host cgroupfs mount; it never execs into targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p11scope-observer
  namespace: p11scope
  labels:
    app.kubernetes.io/name: p11scope
    app.kubernetes.io/component: observer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p11scope-observer
  namespace: p11scope
  labels:
    app.kubernetes.io/name: p11scope
    app.kubernetes.io/component: observer
subjects:
  - kind: ServiceAccount
    name: p11scope-observer
    namespace: p11scope
roleRef:
  kind: Role
  name: p11scope-observer
  apiGroup: rbac.authorization.k8s.io
